                  downloadButton.setVisibility(View.GONE);
                  downloadButton.setOnClickListener(v -> onDownloadButtonClicked());
                  LinearLayout.LayoutParams dlParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  dlParams.topMargin = dp(8);
                  buttonBar.addView(downloadButton, dlParams);

                  FrameLayout.LayoutParams barParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM | Gravity.END);
                  barParams.setMargins(0, 0, dp(16), dp(24));
                  root.addView(buttonBar, barParams);

                  buildPanel();
                  center = new DownloadCenter(this, cookieProvider, this::updateDownloadButton);

                  setContentView(root);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setUseWideViewPort(true);
                  s.setSupportMultipleWindows(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  // Some sites and video players treat the "; wv" WebView marker differently, so drop it.
                  s.setUserAgentString(s.getUserAgentString().replace("; wv", ""));

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);

                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) ->
                          startDownload(url, userAgent, contentDisposition, mimeType));

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (!request.isForMainFrame()) {
                              return false;
                          }
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) {
                              if (looksLikeDownload(uri)) {
                                  startDownload(uri.toString(), view.getSettings().getUserAgentString(), null, null);
                                  return true;
                              }
                              if (isAllowedHost(uri.getHost())) {
                                  return false;
                              }
                              // Ads, pop-ups and redirects to other sites are blocked.
                              notifyBlocked(uri);
                              return true;
                          }
                          if ("blob".equals(scheme) || "data".equals(scheme)
                                  || "about".equals(scheme) || "javascript".equals(scheme)) {
                              return false;
                          }
                          // Non-web links such as mailto: or app links open in the matching app.
                          openExternally(uri);
                          return true;
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          // Runs on a background thread. Only takes note of video addresses; never changes a request.
                          Uri uri = request.getUrl();
                          String path = uri.getPath();
                          if (path != null) {
                              String lower = path.toLowerCase(Locale.ROOT);
                              boolean stream = lower.contains(".m3u8");
                              boolean file = lower.endsWith(".mp4") || lower.endsWith(".mkv") || lower.endsWith(".webm");
                              if (stream || file) {
                                  noteMedia(uri.toString(), stream, request.getRequestHeaders());
                              }
                          }
                          return null;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          progressBar.setVisibility(View.VISIBLE);
                          synchronized (detected) {
                              detected.clear();
                          }
                          updateDownloadButton();
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                          CookieManager.getInstance().flush();
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request,
                                                  WebResourceError error) {
                          if (request.isForMainFrame()) {
                              view.loadDataWithBaseURL(null, ERROR_HTML, "text/html", "UTF-8", null);
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          progressBar.setProgress(newProgress);
                      }

                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          webView.setVisibility(View.GONE);
                          root.addView(view, new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          buttonBar.setVisibility(View.GONE);
                          enterImmersive();
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                      }

                      @Override
                      public void onHideCustomView() {
                          hideCustomView();
                      }

                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture,
                                                    Message resultMsg) {
                          if (!isUserGesture) {
                              return false; // pop-ups that open without a tap are blocked
                          }
                          final WebView popup = new WebView(MainActivity.this);
                          final boolean[] handled = {false};
                          popup.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest request) {
                                  handlePopupUrl(request.getUrl(), handled, v);
                                  return true;
                              }

                              @Override
                              public void onPageStarted(WebView v, String url, Bitmap favicon) {
                                  if (url != null && !"about:blank".equals(url)) {
                                      handlePopupUrl(Uri.parse(url), handled, v);
                                  }
                              }
                          });
                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(popup);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(START_URL);
                  }
              }

              // ------------------------------------------------------------------ site rules

              private boolean isAllowedHost(String host) {
                  if (host == null) {
                      return false;
                  }
                  for (String allowed : ALLOWED_HOSTS) {
                      if (host.equals(allowed) || host.endsWith("." + allowed)) {
                          return true;
                      }
                  }
                  return false;
              }

              private void handlePopupUrl(Uri uri, boolean[] handled, WebView popup) {
                  if (handled[0] || uri == null) {
                      return;
                  }
                  handled[0] = true;
                  popup.stopLoading();
                  new Handler(Looper.getMainLooper()).post(popup::destroy);
                  String scheme = uri.getScheme();
                  if (("http".equals(scheme) || "https".equals(scheme)) && isAllowedHost(uri.getHost())) {
                      webView.loadUrl(uri.toString());
                  } else {
                      notifyBlocked(uri);
                  }
              }

              private void notifyBlocked(Uri uri) {
                  long now = System.currentTimeMillis();
                  if (now - lastBlockedToast > 2500) {
                      lastBlockedToast = now;
                      Toast.makeText(this, "Blocked: " + uri.getHost(), Toast.LENGTH_SHORT).show();
                  }
              }

              private boolean looksLikeDownload(Uri uri) {
                  String path = uri.getPath();
                  if (path == null) {
                      return false;
                  }
                  String lower = path.toLowerCase(Locale.ROOT);
                  for (String ext : DOWNLOAD_EXTENSIONS) {
                      if (lower.endsWith(ext)) {
                          return true;
                      }
                  }
                  return false;
              }

              // ------------------------------------------------------------------ video detection and button

              private void noteMedia(String url, boolean stream, Map<String, String> requestHeaders) {
                  Map<String, String> copy = new HashMap<>();
                  if (requestHeaders != null) {
                      copy.putAll(requestHeaders);
                  }
                  synchronized (detected) {
                      for (Media m : detected) {
                          if (m.url.equals(url)) {
                              return;
                          }
                      }
                      detected.add(new Media(url, stream, copy));
                      while (detected.size() > 20) {
                          detected.remove(0);
                      }
                  }
                  runOnUiThread(this::updateDownloadButton);
              }

              private TextView makeButton(String text, int color) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextColor(0xFFFFFFFF);
                  t.setTextSize(14);
                  t.setPadding(dp(16), dp(10), dp(16), dp(10));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(color);
                  bg.setCornerRadius(dp(24));
                  t.setBackground(bg);
                  t.setElevation(dp(6));
                  return t;
              }

              private void updateDownloadButton() {
                  boolean any;
                  synchronized (detected) {
                      any = !detected.isEmpty();
                  }
                  downloadButton.setVisibility(any ? View.VISIBLE : View.GONE);
                  int active = center.activeCount();
                  int all = center.jobs().size();
                  listButton.setText(active > 0 ? "Downloads (" + active + " running)" : "Downloads (" + all + ")");
                  listButton.setVisibility(all > 0 ? View.VISIBLE : View.GONE);
                  if (active > 0) {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  } else {
                      getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  }
              }

              private void onDownloadButtonClicked() {
                  final List<Media> items;
                  synchronized (detected) {
                      items = new ArrayList<>(detected);
                  }
                  if (items.isEmpty()) {
                      Toast.makeText(this, "No video found yet. Start playing the video first.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  Collections.reverse(items); // newest first
                  String[] labels = new String[items.size()];
                  for (int i = 0; i < labels.length; i++) {
                      labels[i] = labelFor(items.get(i));
                  }
                  new AlertDialog.Builder(this)
                          .setTitle("Choose video to save")
                          .setItems(labels, (dialog, which) -> startMedia(items.get(which)))
                          .show();
              }

              private String labelFor(Media m) {
                  Uri u = Uri.parse(m.url);
                  String name = u.getLastPathSegment();
                  if (name == null) {
                      name = "";
                  }
                  if (name.length() > 30) {
                      name = name.substring(name.length() - 30);
                  }
                  return (m.stream ? "Stream" : "File") + " - " + u.getHost() + " - " + name;
              }

              private interface NameCallback {
                  void got(String baseName);
              }

              /** Works out "Series name - Episode NN" from the page, then calls back on the UI thread. */
              private void resolveBaseName(final NameCallback callback) {
                  final String pageUrl = webView.getUrl() != null ? webView.getUrl() : "";
                  final String pageTitle = webView.getTitle() != null ? webView.getTitle() : "";
                  final boolean[] called = {false};
                  try {
                      webView.evaluateJavascript(
                              "(function(){var m=document.querySelector('meta[property=\"og:title\"]');"
                                      + "var h=document.querySelector('h1');"
                                      + "return JSON.stringify({og:m?m.content:'',h1:h?h.innerText:'',t:document.title});})()",
                              value -> {
                                  if (called[0]) {
                                      return;
                                  }
                                  called[0] = true;
                                  String og = "";
                                  String h1 = "";
                                  String t = pageTitle;
                                  try {
                                      Object inner = new JSONTokener(value).nextValue();
                                      JSONObject o = new JSONObject(String.valueOf(inner));
                                      og = o.optString("og", "");
                                      h1 = o.optString("h1", "");
                                      t = o.optString("t", pageTitle);
                                  } catch (Exception ignored) {
                                      // Fall back to the page title only.
                                  }
                                  callback.got(buildName(og, t, h1, pageUrl));
                              });
                  } catch (Exception e) {
                      called[0] = true;
                      callback.got(buildName("", pageTitle, "", pageUrl));
                  }
              }

              private static final Pattern EP_TEXT =
                      Pattern.compile("(?i)\\b(?:episode|ep)\\.?\\s*#?0*(\\d{1,4})\\b");
              private static final Pattern EP_URL =
                      Pattern.compile("(?i)[/?&#-](?:ep|episode)[-_/=]0*(\\d{1,4})\\b");
              private static final Pattern JUNK = Pattern.compile(
                      "(?i)\\b(miruro(\\.\\w+)?|english\\s+(sub|dub)(bed)?|subbed|dubbed|watch|online|for free|free|hd)\\b");

              static String buildName(String og, String docTitle, String h1, String url) {
                  String[] candidates = {og, docTitle, h1};
                  String episode = null;
                  Matcher um = EP_URL.matcher(url);
                  if (um.find()) {
                      episode = um.group(1);
                  }
                  if (episode == null) {
                      try {
                          String q = Uri.parse(url).getQueryParameter("ep");
                          if (q == null) {
                              q = Uri.parse(url).getQueryParameter("episode");
                          }
                          if (q != null && q.matches("\\d{1,4}")) {
                              episode = String.valueOf(Integer.parseInt(q));
                          }
                      } catch (Exception ignored) {
                          // Not a normal address; try the text instead.
                      }
                  }
                  String series = "";
                  for (String c : candidates) {
                      if (c == null) {
                          continue;
                      }
                      Matcher m = EP_TEXT.matcher(c);
                      String head = c;
                      if (m.find()) {
                          if (episode == null) {
                              episode = m.group(1);
                          }
                          head = c.substring(0, m.start());
                      } else {
                          int cut = firstSeparator(c);
                          if (cut > 0) {
                              head = c.substring(0, cut);
                          }
                      }
                      String cleaned = cleanSeries(head);
                      if (!cleaned.isEmpty() && series.isEmpty()) {
                          series = cleaned;
                      }
                  }
                  if (series.isEmpty()) {
                      series = "video";
                  }
                  if (episode != null) {
                      int n;
                      try {
                          n = Integer.parseInt(episode.replaceFirst("^0+(?=\\d)", ""));
                      } catch (NumberFormatException e) {
                          n = 0;
                      }
                      return series + " - Episode " + (n < 10 ? "0" + n : String.valueOf(n));
                  }
                  return series;
              }

              private static int firstSeparator(String s) {
                  int best = -1;
                  for (String sep : new String[]{" | ", " - ", " \u2013 ", " \u2014 "}) {
                      int i = s.indexOf(sep);
                      if (i > 0 && (best < 0 || i < best)) {
                          best = i;
                      }
                  }
                  return best;
              }

              private static String cleanSeries(String s) {
                  String r = JUNK.matcher(s).replaceAll(" ");
                  r = r.replaceAll("[|:\\u2013\\u2014\\-]+\\s*$", " ").replaceAll("^\\s*[|:\\u2013\\u2014\\-]+", " ");
                  r = r.replaceAll("[\\\\/:*?\"<>|\\p{Cntrl}]", " ").replaceAll("\\s+", " ").trim();
                  r = r.replaceAll("^[\\s\\-\\u2013\\u2014]+|[\\s\\-\\u2013\\u2014,]+$", "");
                  if (r.length() > 80) {
                      r = r.substring(0, 80).trim();
                  }
                  return r;
              }

              private static String extensionOf(String url) {
                  String path = Uri.parse(url).getPath();
                  if (path != null) {
                      int dot = path.lastIndexOf('.');
                      if (dot >= 0 && path.length() - dot <= 6) {
                          return path.substring(dot).toLowerCase(Locale.ROOT);
                      }
                  }
                  return ".mp4";
              }

              private static String headerIgnoreCase(Map<String, String> headers, String name) {
                  for (Map.Entry<String, String> e : headers.entrySet()) {
                      if (e.getKey() != null && e.getKey().equalsIgnoreCase(name)) {
                          return e.getValue();
                      }
                  }
                  return null;
              }

              private void toastLong(String message) {
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show();
              }

              // ------------------------------------------------------------------ saving a chosen video

              private static String mimeFor(String name, String given) {
                  String lower = name.toLowerCase(Locale.ROOT);
                  if (lower.endsWith(".mp4") || lower.endsWith(".m4v")) {
                      return "video/mp4";
                  }
                  if (lower.endsWith(".webm")) {
                      return "video/webm";
                  }
                  if (lower.endsWith(".mkv")) {
                      return "video/x-matroska";
                  }
                  if (lower.endsWith(".ts")) {
                      return "video/mp2t";
                  }
                  if (given != null && !given.isEmpty()) {
                      return given;
                  }
                  return "application/octet-stream";
              }

              private static String safeFileName(String name) {
                  String n = name.replaceAll("[\\\\/:*?\"<>|\\p{Cntrl}]", "_").trim();
                  return n.isEmpty() ? "download" : n;
              }

              /** Adds the page address and browser name the video server may expect. */
              private Map<String, String> enrichedHeaders(Map<String, String> original, String userAgent,
                                                          String referer) {
                  Map<String, String> h = new HashMap<>(original);
                  if (headerIgnoreCase(h, "User-Agent") == null) {
                      h.put("User-Agent", userAgent != null ? userAgent : webView.getSettings().getUserAgentString());
                  }
                  if (headerIgnoreCase(h, "Referer") == null) {
                      String ref = referer != null ? referer : webView.getUrl();
                      if (ref != null) {
                          h.put("Referer", ref);
                      }
                  }
                  return h;
              }

              private void startMedia(Media m) {
                  final Media prepared = new Media(m.url, m.stream, enrichedHeaders(m.headers, null, null));
                  resolveBaseName(base -> {
                      prepared.baseName = base;
                      if (!prepared.stream) {
                          if (!canWrite()) {
                              return;
                          }
                          String name = safeFileName(base + extensionOf(prepared.url));
                          center.addFile(name, mimeFor(name, null), prepared.url, prepared.headers);
                          addedToast(name);
                          return;
                      }
                      Toast.makeText(this, "Reading stream...", Toast.LENGTH_SHORT).show();
                      loadPlaylist(prepared, prepared.url);
                  });
              }

              private void addedToast(String name) {
                  updateDownloadButton();
                  toastLong("Downloading " + name + ". Tap Downloads to see progress.");
              }

              /** Reads a playlist in the background, then continues with quality choice or download. */
              private void loadPlaylist(final Media m, final String playlistUrl) {
                  new Thread(() -> {
                      try {
                          final HlsDownloader.Parsed parsed = HlsDownloader.load(playlistUrl, m.headers, cookieProvider);
                          runOnUiThread(() -> onPlaylistLoaded(m, parsed));
                      } catch (Exception e) {
                          final String message = e.getMessage();
                          runOnUiThread(() -> toastLong("Could not read the stream: " + message));
                      }
                  }, "stream-read").start();
              }

              private void onPlaylistLoaded(final Media m, HlsDownloader.Parsed parsed) {
                  if (parsed.media != null) {
                      beginStreamDownload(m, parsed.media);
                      return;
                  }
                  final List<HlsDownloader.Variant> variants = new ArrayList<>(parsed.variants);
                  if (variants.isEmpty()) {
                      toastLong("No video found in this stream");
                      return;
                  }
                  Collections.sort(variants, (a, b) -> Long.compare(b.bandwidth, a.bandwidth));
                  if (variants.size() == 1) {
                      loadPlaylist(m, variants.get(0).url);
                      return;
                  }
                  String[] labels = new String[variants.size()];
                  for (int i = 0; i < labels.length; i++) {
                      labels[i] = variantLabel(variants.get(i));
                  }
                  new AlertDialog.Builder(this)
                          .setTitle("Choose quality")
                          .setItems(labels, (dialog, which) -> loadPlaylist(m, variants.get(which).url))
                          .show();
              }

              private static String variantLabel(HlsDownloader.Variant v) {
                  String size = v.resolution != null ? v.resolution : "Unknown size";
                  if (v.bandwidth > 0) {
                      long mbPerMinute = Math.max(1, v.bandwidth * 60 / 8 / 1000000);
                      return size + "  (about " + mbPerMinute + " MB per minute)";
                  }
                  return size;
              }

              private void beginStreamDownload(final Media m, final HlsDownloader.MediaPlaylist playlist) {
                  if (playlist.segments.isEmpty()) {
                      toastLong("No video parts found in this stream");
                      return;
                  }
                  if (!canWrite()) {
                      return;
                  }
                  boolean mp4 = playlist.initUrl != null;
                  String name = safeFileName(m.baseName + (mp4 ? ".mp4" : ".ts"));
                  center.addStream(name, mp4 ? "video/mp4" : "video/mp2t", playlist, m.headers);
                  addedToast(name);
              }

              // ------------------------------------------------------------------ plain file downloads

              private boolean canWrite() {
                  if (center.hasCustomFolder()) {
                      return true;
                  }
                  if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P
                          && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, REQ_STORAGE);
                      toastLong("Allow storage access, then tap Download again");
                      return false;
                  }
                  return true;
              }

              private void startDownload(String url, String userAgent, String contentDisposition,
                                         String mimeType) {
                  startDownload(url, userAgent, contentDisposition, mimeType, null, null);
              }

              private void startDownload(String url, String userAgent, String contentDisposition,
                                         String mimeType, String referer, String fileName) {
                  if (url == null || !(url.startsWith("http://") || url.startsWith("https://"))) {
                      toastLong("This type of download is not supported yet");
                      return;
                  }
                  if (!canWrite()) {
                      return;
                  }
                  String name = safeFileName(fileName != null ? fileName
                          : URLUtil.guessFileName(url, contentDisposition, mimeType));
                  Map<String, String> headers = enrichedHeaders(new HashMap<String, String>(), userAgent, referer);
                  center.addFile(name, mimeFor(name, mimeType), url, headers);
                  addedToast(name);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                  if (requestCode == REQ_STORAGE && !granted) {
                      toastLong("Storage permission is needed to save videos");
                  }
              }

              // ------------------------------------------------------------------ downloads screen

              private void buildPanel() {
                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setBackgroundColor(0xFF14161C);
                  panel.setPadding(dp(16), dp(16), dp(16), dp(16));
                  panel.setClickable(true); // keeps taps from reaching the web page underneath
                  panel.setVisibility(View.GONE);

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  TextView title = new TextView(this);
                  title.setText("Downloads");
                  title.setTextColor(0xFFFFFFFF);
                  title.setTextSize(22);
                  header.addView(title, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  TextView close = makeButton("Close", 0xFF2E3340);
                  close.setOnClickListener(v -> hidePanel());
                  header.addView(close);
                  panel.addView(header);

                  folderLabel = new TextView(this);
                  folderLabel.setTextColor(0xFFB8BCC8);
                  folderLabel.setTextSize(13);
                  folderLabel.setPadding(0, dp(12), 0, 0);
                  panel.addView(folderLabel);

                  LinearLayout folderRow = new LinearLayout(this);
                  folderRow.setOrientation(LinearLayout.HORIZONTAL);
                  TextView choose = makeButton("Choose folder", 0xFF7C5CFF);
                  choose.setOnClickListener(v -> chooseFolder());
                  LinearLayout.LayoutParams chooseParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  chooseParams.rightMargin = dp(8);
                  folderRow.addView(choose, chooseParams);
                  TextView reset = makeButton("Use Downloads", 0xFF2E3340);
                  reset.setOnClickListener(v -> {
                      center.resetFolder();
                      refreshPanel();
                  });
                  folderRow.addView(reset);
                  LinearLayout.LayoutParams rowParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  rowParams.topMargin = dp(8);
                  rowParams.bottomMargin = dp(12);
                  panel.addView(folderRow, rowParams);

                  emptyLabel = new TextView(this);
                  emptyLabel.setText("No downloads yet. Play a video and tap the Download button.");
                  emptyLabel.setTextColor(0xFFB8BCC8);
                  emptyLabel.setTextSize(14);
                  panel.addView(emptyLabel);

                  ScrollView scroll = new ScrollView(this);
                  listBox = new LinearLayout(this);
                  listBox.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(listBox, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  panel.addView(scroll, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  root.addView(panel, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              }

              private void showPanel() {
                  panel.setVisibility(View.VISIBLE);
                  panel.bringToFront();
                  buttonBar.setVisibility(View.GONE);
                  refreshPanel();
                  uiHandler.removeCallbacks(refresher);
                  uiHandler.postDelayed(refresher, 500);
              }

              private void hidePanel() {
                  panel.setVisibility(View.GONE);
                  buttonBar.setVisibility(View.VISIBLE);
                  uiHandler.removeCallbacks(refresher);
                  updateDownloadButton();
              }

              private RowViews addRow() {
                  RowViews r = new RowViews();
                  r.box = new LinearLayout(this);
                  r.box.setOrientation(LinearLayout.VERTICAL);
                  r.box.setPadding(dp(12), dp(12), dp(12), dp(12));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xFF1E2129);
                  bg.setCornerRadius(dp(12));
                  r.box.setBackground(bg);

                  r.title = new TextView(this);
                  r.title.setTextColor(0xFFFFFFFF);
                  r.title.setTextSize(15);
                  r.title.setMaxLines(2);
                  r.title.setEllipsize(TextUtils.TruncateAt.END);
                  r.box.addView(r.title);

                  r.bar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  r.bar.setMax(1000);
                  LinearLayout.LayoutParams barParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(8));
                  barParams.topMargin = dp(8);
                  r.box.addView(r.bar, barParams);

                  r.info = new TextView(this);
                  r.info.setTextColor(0xFFB8BCC8);
                  r.info.setTextSize(13);
                  LinearLayout.LayoutParams infoParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  infoParams.topMargin = dp(6);
                  r.box.addView(r.info, infoParams);

                  r.action = makeButton("Stop", 0xFFD64545);
                  r.action.setElevation(0);
                  LinearLayout.LayoutParams actionParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  actionParams.topMargin = dp(8);
                  actionParams.gravity = Gravity.END;
                  r.box.addView(r.action, actionParams);

                  LinearLayout.LayoutParams boxParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  boxParams.bottomMargin = dp(10);
                  listBox.addView(r.box, 0, boxParams); // newest on top
                  return r;
              }

              private void refreshPanel() {
                  List<DownloadCenter.Job> jobs = center.jobs();
                  for (DownloadCenter.Job j : jobs) {
                      if (!rows.containsKey(j)) {
                          rows.put(j, addRow());
                      }
                  }
                  Iterator<Map.Entry<DownloadCenter.Job, RowViews>> it = rows.entrySet().iterator();
                  while (it.hasNext()) {
                      Map.Entry<DownloadCenter.Job, RowViews> e = it.next();
                      if (!jobs.contains(e.getKey())) {
                          listBox.removeView(e.getValue().box);
                          it.remove();
                      }
                  }
                  for (DownloadCenter.Job j : jobs) {
                      updateRow(j, rows.get(j));
                  }
                  folderLabel.setText("Saving to: " + center.folderLabel());
                  emptyLabel.setVisibility(jobs.isEmpty() ? View.VISIBLE : View.GONE);
              }

              private void updateRow(final DownloadCenter.Job job, RowViews r) {
                  r.title.setText(job.name);
                  int state = job.state;
                  long bytes = job.bytes.get();
                  String info;
                  if (state == DownloadCenter.RUNNING) {
                      long now = SystemClock.elapsedRealtime();
                      if (r.lastTime == 0) {
                          r.lastTime = now;
                          r.lastBytes = bytes;
                      } else if (now - r.lastTime >= 1000) {
                          r.speed = (bytes - r.lastBytes) * 1000.0 / (now - r.lastTime);
                          r.lastBytes = bytes;
                          r.lastTime = now;
                      }
                      int total = job.total;
                      if (total > 0) {
                          long done = job.done;
                          r.bar.setIndeterminate(false);
                          r.bar.setProgress((int) (done * 1000L / total));
                          info = (done * 100L / total) + "%";
                      } else {
                          r.bar.setIndeterminate(true);
                          info = "Starting";
                      }
                      info += " - " + formatBytes(bytes) + " - " + formatBytes(r.speed) + "/s";
                      r.action.setText("Stop");
                      r.action.setOnClickListener(v -> job.cancel.set(true));
                  } else {
                      r.bar.setIndeterminate(false);
                      if (state == DownloadCenter.DONE) {
                          r.bar.setProgress(1000);
                          info = "Done - " + formatBytes(bytes) + " - saved in " + job.where;
                      } else if (state == DownloadCenter.FAILED) {
                          info = "Failed: " + job.message;
                      } else {
                          info = "Stopped";
                      }
                      r.action.setText("Remove");
                      r.action.setOnClickListener(v -> {
                          center.remove(job);
                          refreshPanel();
                          updateDownloadButton();
                      });
                  }
                  r.info.setText(info);
              }

              private static String formatBytes(double b) {
                  if (b < 1024) {
                      return (long) b + " B";
                  }
                  double kb = b / 1024;
                  if (kb < 1024) {
                      return String.format(Locale.US, "%.0f KB", kb);
                  }
                  double mb = kb / 1024;
                  if (mb < 1024) {
                      return String.format(Locale.US, "%.1f MB", mb);
                  }
                  return String.format(Locale.US, "%.2f GB", mb / 1024);
              }

              @SuppressWarnings("deprecation")
              private void chooseFolder() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  try {
                      startActivityForResult(i, REQ_FOLDER);
                  } catch (ActivityNotFoundException e) {
                      toastLong("This phone has no folder picker");
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FOLDER && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      Uri uri = data.getData();
                      try {
                          getContentResolver().takePersistableUriPermission(uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      } catch (Exception ignored) {
                          // Some providers do not allow keeping access; it still works until the app closes.
                      }
                      center.setFolder(uri);
                      refreshPanel();
                      toastLong("New downloads will be saved to: " + center.folderLabel());
                  }
              }

              private void openExternally(Uri uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (ActivityNotFoundException ignored) {
                      // No app can handle this link; do nothing.
                  }
              }

              // ------------------------------------------------------------------ fullscreen video and lifecycle

              private void hideCustomView() {
                  if (customView == null) {
                      return;
                  }
                  root.removeView(customView);
                  customView = null;
                  webView.setVisibility(View.VISIBLE);
                  buttonBar.setVisibility(View.VISIBLE);
                  exitImmersive();
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  if (customViewCallback != null) {
                      customViewCallback.onCustomViewHidden();
                      customViewCallback = null;
                  }
              }

              @SuppressWarnings("deprecation")
              private void enterImmersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @SuppressWarnings("deprecation")
              private void exitImmersive() {
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (panel.getVisibility() == View.VISIBLE) {
                      hidePanel();
                  } else if (customView != null) {
                      hideCustomView();
                  } else if (webView.canGoBack()) {
                      webView.goBack();
                  } else if (center.activeCount() > 0) {
                      new AlertDialog.Builder(this)
                              .setMessage("Downloads are still running. Leave and stop them?")
                              .setPositiveButton("Stop and leave", (d, which) -> {
                                  center.cancelAll();
                                  finish();
                              })
                              .setNegativeButton("Stay", null)
                              .show();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  webView.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  webView.onResume();
              }

              @Override
              protected void onDestroy() {
                  center.cancelAll();
                  uiHandler.removeCallbacks(refresher);
                  root.removeAllViews();
                  webView.destroy();
                  super.onDestroy();
              }
          }
