          package com.example.miruroapp;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.SharedPreferences;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.DocumentsContract;
          import android.provider.MediaStore;

          import java.io.BufferedOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.CopyOnWriteArrayList;
          import java.util.concurrent.atomic.AtomicBoolean;
          import java.util.concurrent.atomic.AtomicLong;

          /**
           * Keeps the list of downloads, runs them side by side and decides where the files are saved.
           */
          final class DownloadCenter {

              static final int RUNNING = 0;
              static final int DONE = 1;
              static final int FAILED = 2;
              static final int STOPPED = 3;

              /** How many connections each download uses at the same time. */
              private static final int THREADS = 8;
              private static final String PREFS = "miruro_downloads";
              private static final String KEY_FOLDER = "save_folder";

              static final class Job {
                  final int id;
                  final String name;
                  final String mime;
                  volatile int state = RUNNING;
                  volatile String message = "";
                  volatile String where = "";
                  volatile int done;
                  volatile int total;
                  final AtomicLong bytes = new AtomicLong();
                  final AtomicBoolean cancel = new AtomicBoolean(false);

                  Job(int id, String name, String mime) {
                      this.id = id;
                      this.name = name;
                      this.mime = mime;
                  }
              }

              private interface Work {
                  void run(OutputStream out, Job job) throws IOException;
              }

              private static final class Output {
                  OutputStream stream;
                  Uri uri;
                  File file;
                  boolean mediaStore;
                  String where;
              }

              private final Activity activity;
              private final SharedPreferences prefs;
              private final Runnable onChange;
              private final CopyOnWriteArrayList<Job> jobs = new CopyOnWriteArrayList<>();
              private final HlsDownloader.CookieProvider cookies;
              private int nextId = 1;

              DownloadCenter(Activity activity, HlsDownloader.CookieProvider cookies, Runnable onChange) {
                  this.activity = activity;
                  this.cookies = cookies;
                  this.onChange = onChange;
                  this.prefs = activity.getSharedPreferences(PREFS, Activity.MODE_PRIVATE);
              }

              // ------------------------------------------------------------------ list

              List<Job> jobs() {
                  return new ArrayList<>(jobs);
              }

              int activeCount() {
                  int n = 0;
                  for (Job j : jobs) {
                      if (j.state == RUNNING) {
                          n++;
                      }
                  }
                  return n;
              }

              void remove(Job job) {
                  if (job.state != RUNNING) {
                      jobs.remove(job);
                  }
              }

              void cancelAll() {
                  for (Job j : jobs) {
                      j.cancel.set(true);
                  }
              }

              // ------------------------------------------------------------------ save location

              boolean hasCustomFolder() {
                  return prefs.getString(KEY_FOLDER, null) != null;
              }

              void setFolder(Uri tree) {
                  prefs.edit().putString(KEY_FOLDER, tree.toString()).apply();
              }

              void resetFolder() {
                  prefs.edit().remove(KEY_FOLDER).apply();
              }

              String folderLabel() {
                  String s = prefs.getString(KEY_FOLDER, null);
                  if (s == null) {
                      return "Downloads folder (default)";
                  }
                  try {
                      String id = DocumentsContract.getTreeDocumentId(Uri.parse(s));
                      return Uri.decode(id).replace(':', '/');
                  } catch (Exception e) {
                      return "The folder you chose";
                  }
              }

              // ------------------------------------------------------------------ starting downloads

              Job addStream(String name, String mime, final HlsDownloader.MediaPlaylist playlist,
                            final Map<String, String> headers) {
                  return start(name, mime, new Work() {
                      @Override
                      public void run(OutputStream out, Job job) throws IOException {
                          HlsDownloader.download(playlist, out, headers, cookies, progressFor(job), job.cancel,
                                  job.bytes, THREADS);
                      }
                  });
              }

              Job addFile(String name, String mime, final String url, final Map<String, String> headers) {
                  return start(name, mime, new Work() {
                      @Override
                      public void run(OutputStream out, Job job) throws IOException {
                          HlsDownloader.downloadFile(url, headers, cookies, out, progressFor(job), job.cancel,
                                  job.bytes, THREADS);
                      }
                  });
              }

              private static HlsDownloader.Progress progressFor(final Job job) {
                  return new HlsDownloader.Progress() {
                      @Override
                      public void onProgress(int done, int total) {
                          job.done = done;
                          job.total = total;
                      }
                  };
              }

              private Job start(String name, String mime, final Work work) {
                  final Job job;
                  synchronized (this) {
                      job = new Job(nextId++, name, mime);
                  }
                  jobs.add(job);
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          runJob(job, work);
                      }
                  }, "download-" + job.id).start();
                  changed();
                  return job;
              }

              private void runJob(Job job, Work work) {
                  Output out = null;
                  try {
                      out = open(job);
                      work.run(out.stream, job);
                      finish(out);
                      job.where = out.where;
                      out = null;
                      job.state = DONE;
                  } catch (HlsDownloader.CancelledException e) {
                      discard(out);
                      job.state = STOPPED;
                  } catch (Throwable t) {
                      discard(out);
                      String m = t.getMessage();
                      job.message = (t instanceof OutOfMemoryError) ? "Not enough memory" : (m != null ? m : t.getClass().getSimpleName());
                      job.state = FAILED;
                  } finally {
                      changed();
                  }
              }

              private void changed() {
                  activity.runOnUiThread(onChange);
              }

              // ------------------------------------------------------------------ files

              private Output open(Job job) throws IOException {
                  String saved = prefs.getString(KEY_FOLDER, null);
                  if (saved != null) {
                      try {
                          Uri tree = Uri.parse(saved);
                          Uri parent = DocumentsContract.buildDocumentUriUsingTree(tree,
                                  DocumentsContract.getTreeDocumentId(tree));
                          Uri doc = DocumentsContract.createDocument(activity.getContentResolver(), parent,
                                  job.mime, job.name);
                          if (doc != null) {
                              OutputStream raw = activity.getContentResolver().openOutputStream(doc);
                              if (raw != null) {
                                  Output o = new Output();
                                  o.uri = doc;
                                  o.where = folderLabel();
                                  o.stream = new BufferedOutputStream(raw, 256 * 1024);
                                  return o;
                              }
                          }
                      } catch (Exception ignored) {
                          // The chosen folder is not usable any more; fall back to Downloads below.
                      }
                  }
                  Output o = new Output();
                  o.where = "Downloads";
                  OutputStream raw;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, job.name);
                      values.put(MediaStore.MediaColumns.MIME_TYPE, job.mime);
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                      values.put(MediaStore.MediaColumns.IS_PENDING, 1);
                      Uri uri = activity.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (uri == null) {
                          throw new IOException("Could not create the file");
                      }
                      o.uri = uri;
                      o.mediaStore = true;
                      raw = activity.getContentResolver().openOutputStream(uri);
                      if (raw == null) {
                          throw new IOException("Could not open the file");
                      }
                  } else {
                      File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!dir.exists() && !dir.mkdirs()) {
                          throw new IOException("Could not open the Downloads folder");
                      }
                      o.file = uniqueFile(dir, job.name);
                      raw = new FileOutputStream(o.file);
                  }
                  o.stream = new BufferedOutputStream(raw, 256 * 1024);
                  return o;
              }

              private static File uniqueFile(File dir, String name) {
                  File f = new File(dir, name);
                  if (!f.exists()) {
                      return f;
                  }
                  int dot = name.lastIndexOf('.');
                  String base = dot > 0 ? name.substring(0, dot) : name;
                  String ext = dot > 0 ? name.substring(dot) : "";
                  for (int i = 1; i < 1000; i++) {
                      f = new File(dir, base + " (" + i + ")" + ext);
                      if (!f.exists()) {
                          return f;
                      }
                  }
                  return f;
              }

              private void finish(Output o) throws IOException {
                  o.stream.flush();
                  o.stream.close();
                  if (o.mediaStore) {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      activity.getContentResolver().update(o.uri, values, null, null);
                  } else if (o.file != null) {
                      MediaScannerConnection.scanFile(activity, new String[]{o.file.getAbsolutePath()}, null, null);
                  }
              }

              private void discard(Output o) {
                  if (o == null) {
                      return;
                  }
                  try {
                      o.stream.close();
                  } catch (IOException ignored) {
                      // Already closed or broken; the file is being removed anyway.
                  }
                  try {
                      if (o.mediaStore) {
                          activity.getContentResolver().delete(o.uri, null, null);
                      } else if (o.uri != null) {
                          DocumentsContract.deleteDocument(activity.getContentResolver(), o.uri);
                      } else if (o.file != null) {
                          //noinspection ResultOfMethodCallIgnored
                          o.file.delete();
                      }
                  } catch (Exception ignored) {
                      // Nothing more to clean up.
                  }
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/example/miruroapp/HlsDownloader.java <<'EOF_FILE'
          package com.example.miruroapp;

          import java.io.BufferedInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.concurrent.Callable;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ExecutionException;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.Future;
          import java.util.concurrent.atomic.AtomicBoolean;
          import java.util.concurrent.atomic.AtomicLong;

          import javax.crypto.Cipher;
          import javax.crypto.spec.IvParameterSpec;
          import javax.crypto.spec.SecretKeySpec;

          /**
           * Saves an HLS (.m3u8) stream by fetching every part and joining them in order.
           * Uses no Android classes, so it can be tested on a normal computer.
           */
          final class HlsDownloader {

              interface CookieProvider {
                  String cookieFor(String url);
              }

              interface Progress {
                  void onProgress(int done, int total);
              }

              static final class CancelledException extends IOException {
                  CancelledException() {
                      super("Cancelled");
                  }
              }

              static final class Variant {
                  final String url;
                  final long bandwidth;
                  final String resolution;

                  Variant(String url, long bandwidth, String resolution) {
                      this.url = url;
                      this.bandwidth = bandwidth;
                      this.resolution = resolution;
                  }
              }

              static final class Key {
                  final String url;
                  final byte[] iv; // null means "use the part's sequence number"

                  Key(String url, byte[] iv) {
                      this.url = url;
                      this.iv = iv;
                  }
              }

              static final class Segment {
                  final String url;
                  final long sequence;
                  final Key key; // null when the part is not encrypted
                  final long rangeStart; // -1 when the whole file is used
                  final long rangeLength;

                  Segment(String url, long sequence, Key key, long rangeStart, long rangeLength) {
                      this.url = url;
                      this.sequence = sequence;
                      this.key = key;
                      this.rangeStart = rangeStart;
                      this.rangeLength = rangeLength;
                  }
              }

              static final class MediaPlaylist {
                  final List<Segment> segments = new ArrayList<>();
                  String initUrl; // set for fragmented MP4 streams
                  long initRangeStart = -1;
                  long initRangeLength = -1;
                  boolean ended;
              }

              static final class Parsed {
                  List<Variant> variants; // set for a master playlist (list of qualities)
                  MediaPlaylist media; // set for a media playlist (list of video parts)
              }

              private static final String[] FORWARDED_HEADERS = {
                      "User-Agent", "Referer", "Origin", "Accept-Language", "Authorization"
              };
              private static final int MAX_SEGMENT_BYTES = 150 * 1024 * 1024;
              private static final int MAX_PLAYLIST_BYTES = 8 * 1024 * 1024;

              private HlsDownloader() {
              }

              // ------------------------------------------------------------------ loading / parsing

              static Parsed load(String url, Map<String, String> headers, CookieProvider cookies)
                      throws IOException {
                  HttpURLConnection c = connect(url, headers, cookies, -1, -1);
                  // Relative links inside a playlist are relative to its final address after redirects.
                  String finalUrl = c.getURL().toString();
                  byte[] data;
                  try (InputStream in = c.getInputStream()) {
                      data = drain(in, MAX_PLAYLIST_BYTES);
                  } finally {
                      c.disconnect();
                  }
                  return parse(finalUrl, new String(data, StandardCharsets.UTF_8));
              }

              private static byte[] drain(InputStream in, int max) throws IOException {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[16 * 1024];
                  int n;
                  while ((n = in.read(buf)) != -1) {
                      bo.write(buf, 0, n);
                      if (bo.size() > max) {
                          throw new IOException("Response is too large");
                      }
                  }
                  return bo.toByteArray();
              }

              static Parsed parse(String baseUrl, String text) throws IOException {
                  if (text.startsWith("\uFEFF")) {
                      text = text.substring(1);
                  }
                  if (!text.trim().startsWith("#EXTM3U")) {
                      throw new IOException("This is not a video playlist");
                  }
                  String[] lines = text.replace("\r", "").split("\n");
                  Parsed parsed = new Parsed();
                  if (text.contains("#EXT-X-STREAM-INF")) {
                      parsed.variants = parseMaster(baseUrl, lines);
                  } else {
                      parsed.media = parseMedia(baseUrl, lines);
                  }
                  return parsed;
              }

              private static List<Variant> parseMaster(String base, String[] lines) throws IOException {
                  List<Variant> variants = new ArrayList<>();
                  Map<String, String> pending = null;
                  for (String raw : lines) {
                      String line = raw.trim();
                      if (line.isEmpty()) {
                          continue;
                      }
                      if (line.startsWith("#EXT-X-STREAM-INF:")) {
                          pending = parseAttributes(line.substring(line.indexOf(':') + 1));
                      } else if (line.startsWith("#")) {
                          continue;
                      } else if (pending != null) {
                          long bandwidth = parseLong(pending.get("BANDWIDTH"), -1);
                          if (bandwidth < 0) {
                              bandwidth = parseLong(pending.get("AVERAGE-BANDWIDTH"), -1);
                          }
                          variants.add(new Variant(resolve(base, line), bandwidth, pending.get("RESOLUTION")));
                          pending = null;
                      }
                  }
                  return variants;
              }

              private static MediaPlaylist parseMedia(String base, String[] lines) throws IOException {
                  MediaPlaylist playlist = new MediaPlaylist();
                  long sequence = 0;
                  Key key = null;
                  long pendingLength = -1;
                  long pendingOffset = -1;
                  String lastRangeUrl = null;
                  long lastRangeEnd = 0;

                  for (String raw : lines) {
                      String line = raw.trim();
                      if (line.isEmpty()) {
                          continue;
                      }
                      if (line.startsWith("#EXT-X-MEDIA-SEQUENCE:")) {
                          sequence = parseLong(line.substring(line.indexOf(':') + 1).trim(), 0);
                      } else if (line.startsWith("#EXT-X-KEY:")) {
                          Map<String, String> attrs = parseAttributes(line.substring(line.indexOf(':') + 1));
                          String method = attrs.get("METHOD");
                          String keyFormat = attrs.get("KEYFORMAT");
                          if (method == null || "NONE".equalsIgnoreCase(method)) {
                              key = null;
                          } else if ("AES-128".equalsIgnoreCase(method)
                                  && (keyFormat == null || "identity".equalsIgnoreCase(keyFormat))
                                  && attrs.get("URI") != null) {
                              key = new Key(resolve(base, attrs.get("URI")), parseIv(attrs.get("IV")));
                          } else {
                              throw new IOException("This stream uses " + method
                                      + " protection, which cannot be saved");
                          }
                      } else if (line.startsWith("#EXT-X-MAP:")) {
                          Map<String, String> attrs = parseAttributes(line.substring(line.indexOf(':') + 1));
                          if (attrs.get("URI") != null) {
                              playlist.initUrl = resolve(base, attrs.get("URI"));
                              String range = attrs.get("BYTERANGE");
                              if (range != null) {
                                  long[] r = parseRange(range);
                                  playlist.initRangeLength = r[0];
                                  playlist.initRangeStart = r[1] >= 0 ? r[1] : 0;
                              }
                          }
                      } else if (line.startsWith("#EXT-X-BYTERANGE:")) {
                          long[] r = parseRange(line.substring(line.indexOf(':') + 1).trim());
                          pendingLength = r[0];
                          pendingOffset = r[1];
                      } else if (line.startsWith("#EXT-X-ENDLIST")) {
                          playlist.ended = true;
                      } else if (line.startsWith("#")) {
                          continue;
                      } else {
                          String segmentUrl = resolve(base, line);
                          long rangeStart = -1;
                          long rangeLength = -1;
                          if (pendingLength >= 0) {
                              rangeLength = pendingLength;
                              if (pendingOffset >= 0) {
                                  rangeStart = pendingOffset;
                              } else {
                                  rangeStart = segmentUrl.equals(lastRangeUrl) ? lastRangeEnd : 0;
                              }
                              lastRangeUrl = segmentUrl;
                              lastRangeEnd = rangeStart + rangeLength;
                              pendingLength = -1;
                              pendingOffset = -1;
                          }
                          playlist.segments.add(new Segment(segmentUrl, sequence, key, rangeStart, rangeLength));
                          sequence++;
                      }
                  }
                  return playlist;
              }

              /** Parses "length" or "length@offset"; returns {length, offset or -1}. */
              private static long[] parseRange(String s) {
                  String value = s.trim();
                  int at = value.indexOf('@');
                  if (at < 0) {
                      return new long[]{parseLong(value, -1), -1};
                  }
                  return new long[]{parseLong(value.substring(0, at), -1), parseLong(value.substring(at + 1), -1)};
              }

              static Map<String, String> parseAttributes(String s) {
                  Map<String, String> map = new HashMap<>();
                  int i = 0;
                  int n = s.length();
                  while (i < n) {
                      int eq = s.indexOf('=', i);
                      if (eq < 0) {
                          break;
                      }
                      String name = s.substring(i, eq).trim().toUpperCase(Locale.ROOT);
                      int j = eq + 1;
                      String value;
                      if (j < n && s.charAt(j) == '"') {
                          int end = s.indexOf('"', j + 1);
                          if (end < 0) {
                              end = n;
                          }
                          value = s.substring(j + 1, end);
                          i = end + 1;
                      } else {
                          int end = s.indexOf(',', j);
                          if (end < 0) {
                              end = n;
                          }
                          value = s.substring(j, end).trim();
                          i = end;
                      }
                      if (i < n && s.charAt(i) == ',') {
                          i++;
                      }
                      map.put(name, value);
                  }
                  return map;
              }

              private static long parseLong(String s, long fallback) {
                  if (s == null) {
                      return fallback;
                  }
                  try {
                      return Long.parseLong(s.trim());
                  } catch (NumberFormatException e) {
                      return fallback;
                  }
              }

              private static byte[] parseIv(String s) throws IOException {
                  if (s == null) {
                      return null;
                  }
                  String hex = (s.startsWith("0x") || s.startsWith("0X")) ? s.substring(2) : s;
                  if (hex.length() % 2 == 1) {
                      hex = "0" + hex;
                  }
                  byte[] raw = new byte[hex.length() / 2];
                  try {
                      for (int i = 0; i < raw.length; i++) {
                          raw[i] = (byte) Integer.parseInt(hex.substring(i * 2, i * 2 + 2), 16);
                      }
                  } catch (NumberFormatException e) {
                      throw new IOException("Bad encryption settings in the playlist");
                  }
                  byte[] iv = new byte[16];
                  int copy = Math.min(16, raw.length);
                  System.arraycopy(raw, raw.length - copy, iv, 16 - copy, copy);
                  return iv;
              }

              static String resolve(String base, String ref) throws IOException {
                  return new URL(new URL(base), ref.trim()).toString();
              }

              // ------------------------------------------------------------------ downloading

              /** Number of parts fetched at the same time. */
              static final int DEFAULT_THREADS = 8;
              private static final int FILE_CHUNK_BYTES = 2 * 1024 * 1024;

              interface Fetcher {
                  byte[] fetch(int index) throws IOException;
              }

              static void download(MediaPlaylist playlist, OutputStream out, Map<String, String> headers,
                                   CookieProvider cookies, Progress progress, AtomicBoolean cancel)
                      throws IOException {
                  download(playlist, out, headers, cookies, progress, cancel, null, DEFAULT_THREADS);
              }

              /** Saves a playlist. Parts are fetched several at a time and written in order. */
              static void download(final MediaPlaylist playlist, OutputStream out,
                                   final Map<String, String> headers, final CookieProvider cookies,
                                   Progress progress, final AtomicBoolean cancel, final AtomicLong bytes,
                                   int threads) throws IOException {
                  if (playlist.segments.isEmpty()) {
                      throw new IOException("The playlist has no video parts");
                  }
                  final Map<String, byte[]> keyCache = new ConcurrentHashMap<>();
                  if (playlist.initUrl != null) {
                      byte[] init = fetchWithRetry(playlist.initUrl, playlist.initRangeStart,
                              playlist.initRangeLength, null, 0, headers, cookies, keyCache, cancel, bytes);
                      out.write(init);
                  }
                  runOrdered(playlist.segments.size(), new Fetcher() {
                      @Override
                      public byte[] fetch(int index) throws IOException {
                          Segment s = playlist.segments.get(index);
                          return fetchWithRetry(s.url, s.rangeStart, s.rangeLength, s.key, s.sequence,
                                  headers, cookies, keyCache, cancel, bytes);
                      }
                  }, out, threads, progress, cancel);
              }

              /**
               * Saves a plain file. When the server supports byte ranges the file is fetched in pieces
               * over several connections at once, which uses much more of the available speed.
               */
              static void downloadFile(final String url, final Map<String, String> headers,
                                       final CookieProvider cookies, OutputStream out, Progress progress,
                                       final AtomicBoolean cancel, final AtomicLong bytes, int threads)
                      throws IOException {
                  long size = -1;
                  boolean ranges = false;
                  HttpURLConnection probe = connect(url, headers, cookies, 0, 1);
                  try {
                      int code = probe.getResponseCode();
                      if (code == 206) {
                          String cr = probe.getHeaderField("Content-Range");
                          if (cr != null) {
                              int slash = cr.lastIndexOf('/');
                              if (slash >= 0) {
                                  size = parseLong(cr.substring(slash + 1).trim(), -1);
                              }
                          }
                          ranges = size > 0;
                      } else {
                          size = probe.getContentLengthLong();
                      }
                  } finally {
                      probe.disconnect();
                  }
                  if (!ranges || size < 2L * FILE_CHUNK_BYTES) {
                      copySingle(url, headers, cookies, out, progress, cancel, bytes, size);
                      return;
                  }
                  final long total = size;
                  int count = (int) ((total + FILE_CHUNK_BYTES - 1) / FILE_CHUNK_BYTES);
                  runOrdered(count, new Fetcher() {
                      @Override
                      public byte[] fetch(int index) throws IOException {
                          long start = (long) index * FILE_CHUNK_BYTES;
                          long length = Math.min(FILE_CHUNK_BYTES, total - start);
                          return fetchWithRetry(url, start, length, null, 0, headers, cookies, null, cancel, bytes);
                      }
                  }, out, threads, progress, cancel);
              }

              private static void copySingle(String url, Map<String, String> headers, CookieProvider cookies,
                                             OutputStream out, Progress progress, AtomicBoolean cancel,
                                             AtomicLong bytes, long size) throws IOException {
                  HttpURLConnection c = connect(url, headers, cookies, -1, -1);
                  try (InputStream in = new BufferedInputStream(c.getInputStream())) {
                      byte[] buf = new byte[64 * 1024];
                      long read = 0;
                      int n;
                      while ((n = in.read(buf)) >= 0) {
                          checkCancel(cancel);
                          out.write(buf, 0, n);
                          read += n;
                          if (bytes != null) {
                              bytes.addAndGet(n);
                          }
                          if (progress != null && size > 0) {
                              progress.onProgress((int) Math.min(Integer.MAX_VALUE, read / 1024),
                                      (int) Math.min(Integer.MAX_VALUE, size / 1024));
                          }
                      }
                  } finally {
                      c.disconnect();
                  }
              }

              /** Fetches parts [0, count) with several workers, writing results strictly in order. */
              static void runOrdered(int count, final Fetcher fetcher, OutputStream out, int threads,
                                     Progress progress, AtomicBoolean cancel) throws IOException {
                  int workers = Math.max(1, Math.min(threads, count));
                  ExecutorService pool = Executors.newFixedThreadPool(workers);
                  try {
                      int window = workers * 2;
                      ArrayDeque<Future<byte[]>> queue = new ArrayDeque<>();
                      int next = 0;
                      for (int written = 0; written < count; written++) {
                          checkCancel(cancel);
                          while (next < count && queue.size() < window) {
                              final int index = next++;
                              queue.add(pool.submit(new Callable<byte[]>() {
                                  @Override
                                  public byte[] call() throws IOException {
                                      return fetcher.fetch(index);
                                  }
                              }));
                          }
                          byte[] data;
                          try {
                              data = queue.poll().get();
                          } catch (InterruptedException e) {
                              Thread.currentThread().interrupt();
                              throw new CancelledException();
                          } catch (ExecutionException e) {
                              Throwable cause = e.getCause();
                              if (cause instanceof IOException) {
                                  throw (IOException) cause;
                              }
                              throw new IOException(String.valueOf(cause));
                          }
                          out.write(data);
                          if (progress != null) {
                              progress.onProgress(written + 1, count);
                          }
                      }
                  } finally {
                      pool.shutdownNow();
                  }
              }

              private static void checkCancel(AtomicBoolean cancel) throws CancelledException {
                  if (cancel != null && cancel.get()) {
                      throw new CancelledException();
                  }
              }

              private static byte[] fetchWithRetry(String url, long rangeStart, long rangeLength, Key key,
                                                   long sequence, Map<String, String> headers,
                                                   CookieProvider cookies, Map<String, byte[]> keyCache,
                                                   AtomicBoolean cancel, AtomicLong bytes) throws IOException {
                  IOException last = null;
                  for (int attempt = 0; attempt < 3; attempt++) {
                      checkCancel(cancel);
                      try {
                          return fetchOnce(url, rangeStart, rangeLength, key, sequence, headers, cookies,
                                  keyCache, cancel, bytes);
                      } catch (CancelledException e) {
                          throw e;
                      } catch (IOException e) {
                          last = e;
                          try {
                              Thread.sleep(1000L * (attempt + 1));
                          } catch (InterruptedException ie) {
                              Thread.currentThread().interrupt();
                              throw new CancelledException();
                          }
                      }
                  }
                  throw last;
              }

              private static byte[] fetchOnce(String url, long rangeStart, long rangeLength, Key key,
                                              long sequence, Map<String, String> headers,
                                              CookieProvider cookies, Map<String, byte[]> keyCache,
                                              AtomicBoolean cancel, AtomicLong bytes)
                      throws IOException {
                  HttpURLConnection c = connect(url, headers, cookies, rangeStart, rangeLength);
                  byte[] raw;
                  long counted = 0;
                  try {
                      int code = c.getResponseCode();
                      InputStream in = new BufferedInputStream(c.getInputStream());
                      long limit = -1;
                      if (rangeLength >= 0) {
                          if (code == 200) {
                              skipFully(in, rangeStart); // the server ignored the Range request
                          }
                          limit = rangeLength;
                      }
                      ByteArrayOutputStream bo = new ByteArrayOutputStream(limit > 0 && limit < MAX_SEGMENT_BYTES
                              ? (int) limit : 256 * 1024);
                      byte[] buf = new byte[64 * 1024];
                      long remaining = limit;
                      while (limit < 0 || remaining > 0) {
                          checkCancel(cancel);
                          int want = limit < 0 ? buf.length : (int) Math.min(buf.length, remaining);
                          int n = in.read(buf, 0, want);
                          if (n < 0) {
                              break;
                          }
                          bo.write(buf, 0, n);
                          if (bytes != null) {
                              bytes.addAndGet(n);
                              counted += n;
                          }
                          if (limit >= 0) {
                              remaining -= n;
                          }
                          if (bo.size() > MAX_SEGMENT_BYTES) {
                              throw new IOException("A video part is too large");
                          }
                      }
                      if (limit >= 0 && remaining > 0) {
                          throw new IOException("A video part ended too early");
                      }
                      raw = bo.toByteArray();
                  } catch (IOException e) {
                      if (bytes != null) {
                          bytes.addAndGet(-counted); // this attempt will be repeated
                      }
                      throw e;
                  } finally {
                      c.disconnect();
                  }
                  if (key == null) {
                      return raw;
                  }
                  byte[] keyBytes = keyCache.get(key.url);
                  if (keyBytes == null) {
                      keyBytes = readAll(key.url, headers, cookies, 1024);
                      if (keyBytes.length != 16) {
                          throw new IOException("Unexpected encryption key size");
                      }
                      keyCache.put(key.url, keyBytes);
                  }
                  try {
                      Cipher cipher = Cipher.getInstance("AES/CBC/PKCS5Padding");
                      cipher.init(Cipher.DECRYPT_MODE, new SecretKeySpec(keyBytes, "AES"),
                              new IvParameterSpec(ivFor(key, sequence)));
                      return cipher.doFinal(raw);
                  } catch (Exception e) {
                      throw new IOException("Could not decrypt a video part");
                  }
              }

              private static byte[] ivFor(Key key, long sequence) {
                  if (key.iv != null) {
                      return key.iv;
                  }
                  byte[] iv = new byte[16];
                  for (int i = 0; i < 8; i++) {
                      iv[15 - i] = (byte) (sequence >>> (8 * i));
                  }
                  return iv;
              }

              private static void skipFully(InputStream in, long count) throws IOException {
                  long left = count;
                  byte[] tmp = new byte[16 * 1024];
                  while (left > 0) {
                      long skipped = in.skip(left);
                      if (skipped <= 0) {
                          int n = in.read(tmp, 0, (int) Math.min(tmp.length, left));
                          if (n < 0) {
                              throw new IOException("Unexpected end of data");
                          }
                          skipped = n;
                      }
                      left -= skipped;
                  }
              }

              // ------------------------------------------------------------------ http

              private static byte[] readAll(String url, Map<String, String> headers, CookieProvider cookies,
                                            int max) throws IOException {
                  HttpURLConnection c = connect(url, headers, cookies, -1, -1);
                  try (InputStream in = c.getInputStream()) {
                      return drain(in, max);
                  } finally {
                      c.disconnect();
                  }
              }

              private static HttpURLConnection connect(String url, Map<String, String> headers,
                                                       CookieProvider cookies, long rangeStart,
                                                       long rangeLength) throws IOException {
                  String current = url;
                  for (int hop = 0; hop < 6; hop++) {
                      HttpURLConnection c = (HttpURLConnection) new URL(current).openConnection();
                      c.setInstanceFollowRedirects(false);
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(30000);
                      if (headers != null) {
                          for (String name : FORWARDED_HEADERS) {
                              String value = headerIgnoreCase(headers, name);
                              if (value != null) {
                                  c.setRequestProperty(name, value);
                              }
                          }
                      }
                      if (cookies != null) {
                          String cookie = cookies.cookieFor(current);
                          if (cookie != null && !cookie.isEmpty()) {
                              c.setRequestProperty("Cookie", cookie);
                          }
                      }
                      if (rangeStart >= 0 && rangeLength >= 0) {
                          c.setRequestProperty("Range", "bytes=" + rangeStart + "-" + (rangeStart + rangeLength - 1));
                      }
                      c.setRequestProperty("Accept-Encoding", "identity");
                      int code = c.getResponseCode();
                      if (code == 301 || code == 302 || code == 303 || code == 307 || code == 308) {
                          String location = c.getHeaderField("Location");
                          c.disconnect();
                          if (location == null) {
                              throw new IOException("Redirect without a target");
                          }
                          current = resolve(current, location);
                          continue;
                      }
                      if (code == 200 || code == 206) {
                          return c;
                      }
                      c.disconnect();
                      throw new IOException("The server answered " + code);
                  }
                  throw new IOException("Too many redirects");
              }

              private static String headerIgnoreCase(Map<String, String> headers, String name) {
                  for (Map.Entry<String, String> e : headers.entrySet()) {
                      if (e.getKey() != null && e.getKey().equalsIgnoreCase(name)) {
                          return e.getValue();
                      }
                  }
                  return null;
              }
          }
