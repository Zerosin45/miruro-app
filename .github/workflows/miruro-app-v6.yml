# Miruro Android app: one-file builder.
# This single file creates the whole Android project, builds the APK, and publishes it
# on the repository's Releases page (Releases -> latest -> MiruroApp.apk).
# Edit START_URL inside MainActivity.java below to change the site.
name: Build Miruro APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create the Android project
        run: |
          mkdir -p proj
          cd proj
          mkdir -p app
          mkdir -p app/src/main
          mkdir -p app/src/main/java/com/example/miruroapp
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.miruroapp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.oniksimsung.miruro"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  debug {
                      storeFile file('signing.jks')
                      storePassword 'miruro123'
                      keyAlias 'miruro'
                      keyPassword 'miruro123'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE
