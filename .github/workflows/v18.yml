          include(":app")
          EOF_FILE
          base64 -d app/signing.b64 > app/signing.jks

      - name: Download ad and tracker block lists
        run: |
          mkdir -p proj/app/src/main/assets
          cd proj/app/src/main/assets
          printf '%s\n' werefilledwit.org > raw.txt
          curl -fsSL --retry 3 https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts | awk '($1=="0.0.0.0"||$1=="127.0.0.1")&&$2!~/^(localhost|0\.0\.0\.0|local|broadcasthost)/{print $2}' >> raw.txt || true
          curl -fsSL --retry 3 "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=nohtml&showintro=0" >> raw.txt || true
          tr -d '\r' < raw.txt | tr 'A-Z' 'a-z' | sort -u > blocklist.txt
          rm raw.txt
          wc -l blocklist.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk MiruroApp.apk

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiruroApp-apk
          path: MiruroApp.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_id }}" MiruroApp.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Miruro app build ${{ github.run_number }}" \
            --notes "Download MiruroApp.apk below and install it on your Android phone."
