          cat > app/src/main/java/com/example/miruroapp/DownloadCenter.java <<'EOF_FILE'
          package com.example.miruroapp;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.SharedPreferences;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.os.ParcelFileDescriptor;
          import android.os.StatFs;
          import android.provider.DocumentsContract;
          import android.provider.MediaStore;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.CopyOnWriteArrayList;
          import java.util.concurrent.atomic.AtomicBoolean;
          import java.util.concurrent.atomic.AtomicLong;

          /**
           * Keeps the list of downloads (running ones and a saved history), runs them side by side,
           * and handles opening, renaming and deleting the saved files.
           */
          final class DownloadCenter {

              static final int RUNNING = 0;
              static final int DONE = 1;
              static final int FAILED = 2;
              static final int STOPPED = 3;

              /** How many connections each download uses at the same time. */
              private static final int THREADS = 8;
              private static final String PREFS = "miruro_downloads";
              private static final String KEY_FOLDER = "save_folder";
              private static final String KEY_HISTORY = "history";
              private static final int MAX_RECORDS = 300;

              private interface Work {
                  void run(OutputStream out, Job job) throws IOException;
              }

              /** A download that is running, failed or stopped. */
              static final class Job {
                  final int id;
                  final String name;
                  final String mime;
                  final String source;
                  final String poster;
                  final boolean estimated;
                  final Work work;
                  volatile int state = RUNNING;
                  volatile String message = "";
                  volatile int done;
                  volatile int total;
                  final AtomicLong bytes = new AtomicLong();
                  final AtomicBoolean cancel = new AtomicBoolean(false);
                  final AtomicBoolean pause = new AtomicBoolean(false);

                  Job(int id, String name, String mime, String source, String poster, boolean estimated, Work work) {
                      this.id = id;
                      this.name = name;
                      this.mime = mime;
                      this.source = source;
                      this.poster = poster;
                      this.estimated = estimated;
                      this.work = work;
                  }
              }

              /** A finished download that is kept in the history list. */
              static final class Record {
                  String name = "";
                  String mime = "";
                  String uri = "";
                  String source = "";
                  String poster = "";
                  long size;
                  long time;

                  boolean isVideo() {
                      return mime != null && mime.startsWith("video/");
                  }
              }

              private static final class Output {
                  OutputStream stream;
                  Uri uri;
                  File file;
                  boolean mediaStore;
                  String name;
              }

              private final Activity activity;
              private final SharedPreferences prefs;
              private final Runnable onChange;
              private final CopyOnWriteArrayList<Job> jobs = new CopyOnWriteArrayList<>();
              private final CopyOnWriteArrayList<Record> records = new CopyOnWriteArrayList<>();
              private final HlsDownloader.CookieProvider cookies;
              private int nextId = 1;

              DownloadCenter(Activity activity, HlsDownloader.CookieProvider cookies, Runnable onChange) {
                  this.activity = activity;
                  this.cookies = cookies;
                  this.onChange = onChange;
                  this.prefs = activity.getSharedPreferences(PREFS, Activity.MODE_PRIVATE);
                  loadRecords();
              }

              // ------------------------------------------------------------------ lists

              List<Job> jobs() {
                  return new ArrayList<>(jobs);
              }

              List<Record> records() {
                  return new ArrayList<>(records);
              }

              int recordCount() {
                  return records.size();
              }

              int activeCount() {
                  int n = 0;
                  for (Job j : jobs) {
                      if (j.state == RUNNING) {
                          n++;
                      }
                  }
                  return n;
              }

              void remove(Job job) {
                  if (job.state != RUNNING) {
                      jobs.remove(job);
                  }
              }

              void cancelAll() {
                  for (Job j : jobs) {
                      j.cancel.set(true);
                  }
              }

              void togglePause(Job job) {
                  if (job.state == RUNNING) {
                      job.pause.set(!job.pause.get());
                      changed();
                  }
              }

              /** Starts a failed or stopped download again from the beginning. */
              void retry(Job old) {
                  if (old.state == RUNNING) {
                      return;
                  }
                  jobs.remove(old);
                  start(old.name, old.mime, old.work, old.source, old.poster, old.estimated);
              }

              // ------------------------------------------------------------------ history

              private void loadRecords() {
                  String s = prefs.getString(KEY_HISTORY, null);
                  if (s == null) {
                      return;
                  }
                  try {
                      JSONArray a = new JSONArray(s);
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject o = a.getJSONObject(i);
                          Record r = new Record();
                          r.name = o.optString("name", "");
                          r.mime = o.optString("mime", "");
                          r.uri = o.optString("uri", "");
                          r.source = o.optString("source", "");
                r.poster = o.optString("poster", "");
                          r.size = o.optLong("size", 0);
                          r.time = o.optLong("time", 0);
                          if (!r.uri.isEmpty()) {
                              records.add(r);
                          }
                      }
                  } catch (Exception ignored) {
                      // A damaged history is simply ignored.
                  }
              }

              private synchronized void saveRecords() {
                  JSONArray a = new JSONArray();
                  for (Record r : records) {
                      try {
                          JSONObject o = new JSONObject();
                          o.put("name", r.name);
                          o.put("mime", r.mime);
                          o.put("uri", r.uri);
                          o.put("source", r.source);
                o.put("poster", r.poster);
                          o.put("size", r.size);
                          o.put("time", r.time);
                          a.put(o);
                      } catch (Exception ignored) {
                          // Skip one bad entry.
                      }
                  }
                  prefs.edit().putString(KEY_HISTORY, a.toString()).apply();
              }

              private void addRecord(Job job, Output o) {
                  final Record r = new Record();
                  r.name = o.name != null ? o.name : job.name;
                  r.mime = job.mime;
                  r.source = job.source;
                  r.poster = job.poster;
                  r.size = job.bytes.get();
                  r.time = System.currentTimeMillis();
                  if (o.uri != null) {
                      r.uri = o.uri.toString();
                  } else if (o.file != null) {
                      r.uri = Uri.fromFile(o.file).toString();
                  }
                  records.add(0, r);
                  while (records.size() > MAX_RECORDS) {
                      records.remove(records.size() - 1);
                  }
                  saveRecords();
                  if (o.uri == null && o.file != null) {
                      // On old phones, swap the plain file address for one other apps are allowed to open.
                      MediaScannerConnection.scanFile(activity, new String[]{o.file.getAbsolutePath()}, null,
                              (path, uri) -> {
                                  if (uri != null) {
                                      r.uri = uri.toString();
                                      saveRecords();
                                  }
                              });
                  }
              }

              /** Drops history entries whose file was deleted outside the app. */
              void pruneMissing() {
                  new Thread(() -> {
                      boolean any = false;
                      for (Record r : new ArrayList<>(records)) {
                          if (!exists(r)) {
                              records.remove(r);
                              any = true;
                          }
                      }
                      if (any) {
                          saveRecords();
                          changed();
                      }
                  }, "prune").start();
              }

              private boolean exists(Record r) {
                  try {
                      Uri u = Uri.parse(r.uri);
                      if ("file".equals(u.getScheme())) {
                          return new File(u.getPath()).exists();
                      }
                      ParcelFileDescriptor fd = activity.getContentResolver().openFileDescriptor(u, "r");
                      if (fd == null) {
                          return false;
                      }
                      fd.close();
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              void deleteRecord(Record r) {
                  try {
                      Uri u = Uri.parse(r.uri);
                      if ("file".equals(u.getScheme())) {
                          //noinspection ResultOfMethodCallIgnored
                          new File(u.getPath()).delete();
                      } else if (DocumentsContract.isDocumentUri(activity, u)) {
                          DocumentsContract.deleteDocument(activity.getContentResolver(), u);
                      } else {
                          activity.getContentResolver().delete(u, null, null);
                      }
                  } catch (Exception ignored) {
                      // The file may already be gone; the entry is removed either way.
                  }
                  records.remove(r);
                  saveRecords();
                  changed();
              }

              boolean renameRecord(Record r, String newName) {
                  try {
                      Uri u = Uri.parse(r.uri);
                      Uri result = null;
                      if ("file".equals(u.getScheme())) {
                          File f = new File(u.getPath());
                          File to = new File(f.getParentFile(), newName);
                          if (f.renameTo(to)) {
                              result = Uri.fromFile(to);
                          }
                      } else if (DocumentsContract.isDocumentUri(activity, u)) {
                          result = DocumentsContract.renameDocument(activity.getContentResolver(), u, newName);
                      } else {
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.MediaColumns.DISPLAY_NAME, newName);
                          if (activity.getContentResolver().update(u, v, null, null) > 0) {
                              result = u;
                          }
                      }
                      if (result == null) {
                          return false;
                      }
                      r.name = newName;
                      r.uri = result.toString();
                      saveRecords();
                      changed();
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              long usedBytes() {
                  long n = 0;
                  for (Record r : records) {
                      n += r.size;
                  }
                  return n;
              }

              static long deviceTotal() {
                  try {
                      return new StatFs(Environment.getExternalStorageDirectory().getPath()).getTotalBytes();
                  } catch (Exception e) {
                      return 0;
                  }
              }

              // ------------------------------------------------------------------ save location

              boolean hasCustomFolder() {
                  return prefs.getString(KEY_FOLDER, null) != null;
              }

              void setFolder(Uri tree) {
                  prefs.edit().putString(KEY_FOLDER, tree.toString()).apply();
              }

              void resetFolder() {
                  prefs.edit().remove(KEY_FOLDER).apply();
              }

              String folderLabel() {
                  String s = prefs.getString(KEY_FOLDER, null);
                  if (s == null) {
                      return "Downloads folder (default)";
                  }
                  try {
                      String id = DocumentsContract.getTreeDocumentId(Uri.parse(s));
                      return Uri.decode(id).replace(':', '/');
                  } catch (Exception e) {
                      return "The folder you chose";
                  }
              }

              // ------------------------------------------------------------------ starting downloads

              Job addStream(String name, String mime, final HlsDownloader.MediaPlaylist playlist,
                            final Map<String, String> headers, String poster) {
                  return start(name, mime, new Work() {
                      @Override
                      public void run(OutputStream out, Job job) throws IOException {
                          HlsDownloader.download(playlist, out, headers, cookies, progressFor(job), job.cancel,
                                  job.bytes, THREADS, job.pause);
                      }
                  }, sourceOf(headers, null), poster, true);
              }

              Job addFile(String name, String mime, final String url, final Map<String, String> headers, String poster) {
                  return start(name, mime, new Work() {
                      @Override
                      public void run(OutputStream out, Job job) throws IOException {
                          HlsDownloader.downloadFile(url, headers, cookies, out, progressFor(job), job.cancel,
                                  job.bytes, THREADS, job.pause);
                      }
                  }, sourceOf(headers, url), poster, false);
              }

              private static String sourceOf(Map<String, String> headers, String url) {
                  String ref = null;
                  if (headers != null) {
                      for (Map.Entry<String, String> e : headers.entrySet()) {
                          if (e.getKey() != null && e.getKey().equalsIgnoreCase("Referer")) {
                              ref = e.getValue();
                          }
                      }
                  }
                  String s = hostOf(ref);
                  if (s.isEmpty()) {
                      s = hostOf(url);
                  }
                  return s;
              }

              private static String hostOf(String u) {
                  if (u == null) {
                      return "";
                  }
                  try {
                      String h = Uri.parse(u).getHost();
                      return h == null ? "" : h;
                  } catch (Exception e) {
                      return "";
                  }
              }

              private static HlsDownloader.Progress progressFor(final Job job) {
                  return new HlsDownloader.Progress() {
                      @Override
                      public void onProgress(int done, int total) {
                          job.done = done;
                          job.total = total;
                      }
                  };
              }

              private Job start(String name, String mime, Work work, String source, String poster, boolean estimated) {
                  final Job job;
                  synchronized (this) {
                      job = new Job(nextId++, name, mime, source, poster, estimated, work);
                  }
                  jobs.add(job);
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          runJob(job);
                      }
                  }, "download-" + job.id).start();
                  changed();
                  return job;
              }

              private void runJob(Job job) {
                  Output out = null;
                  try {
                      out = open(job);
                      job.work.run(out.stream, job);
                      finish(out);
                      Output saved = out;
                      out = null;
                      addRecord(job, saved);
                      job.state = DONE;
                      jobs.remove(job);
                  } catch (HlsDownloader.CancelledException e) {
                      discard(out);
                      job.state = STOPPED;
                  } catch (Throwable t) {
                      discard(out);
                      String m = t.getMessage();
                      job.message = (t instanceof OutOfMemoryError) ? "Not enough memory" : (m != null ? m : t.getClass().getSimpleName());
                      job.state = FAILED;
                  } finally {
                      changed();
                  }
              }

              private void changed() {
                  activity.runOnUiThread(onChange);
              }

              // ------------------------------------------------------------------ files

              private Output open(Job job) throws IOException {
                  String saved = prefs.getString(KEY_FOLDER, null);
                  if (saved != null) {
