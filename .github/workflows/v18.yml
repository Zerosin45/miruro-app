                  int active = center.activeCount();
                  int all = center.jobs().size() + center.recordCount();
                  listButton.setText(active > 0 ? "Downloads (" + active + " running)" : "Downloads");
                  listButton.setVisibility(all > 0 ? View.VISIBLE : View.GONE);
                  if (active > 0) {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
