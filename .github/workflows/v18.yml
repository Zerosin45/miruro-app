                              }
                              throw new IOException(String.valueOf(cause));
                          }
                          out.write(data);
                          if (progress != null) {
                              progress.onProgress(written + 1, count);
                          }
                      }
                  } finally {
                      pool.shutdownNow();
                  }
              }

              private static void awaitResume(AtomicBoolean pause, AtomicBoolean cancel) throws CancelledException {
                  while (pause != null && pause.get()) {
                      checkCancel(cancel);
