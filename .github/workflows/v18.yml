              private volatile java.util.Set<String> blocklist = java.util.Collections.emptySet();

              private void loadBlocklist(final Runnable then) {
                  new Thread(() -> {
                      java.util.HashSet<String> set = new java.util.HashSet<>(300000);
                      try (java.io.BufferedReader r = new java.io.BufferedReader(new java.io.InputStreamReader(
                              getAssets().open("blocklist.txt"), java.nio.charset.StandardCharsets.UTF_8))) {
                          String line;
                          while ((line = r.readLine()) != null) {
                              line = line.trim().toLowerCase(Locale.ROOT);
                              if (!line.isEmpty() && !line.startsWith("#")) {
                                  set.add(line);
                              }
                          }
                      } catch (IOException ignored) {
                          // No list available: nothing extra is blocked.
                      }
                      blocklist = set;
                      runOnUiThread(then);
                  }, "blocklist").start();
              }

              private boolean isBlockedHost(String host) {
                  if (host == null || isAllowedHost(host)) {
                      return false;
                  }
                  java.util.Set<String> set = blocklist;
                  String h = host.toLowerCase(Locale.ROOT);
                  while (true) {
                      if (set.contains(h)) {
                          return true;
                      }
                      int dot = h.indexOf('.');
                      if (dot < 0 || h.indexOf('.', dot + 1) < 0) {
                          return false;
                      }
                      h = h.substring(dot + 1);
                  }
              }

              private boolean isAllowedHost(String host) {
                  if (host == null) {
                      return false;
                  }
                  for (String allowed : ALLOWED_HOSTS) {
                      if (host.equals(allowed) || host.endsWith("." + allowed)) {
                          return true;
                      }
                  }
                  return false;
              }

              private void handlePopupUrl(Uri uri, boolean[] handled, WebView popup) {
                  if (handled[0] || uri == null) {
                      return;
                  }
                  handled[0] = true;
                  popup.stopLoading();
                  new Handler(Looper.getMainLooper()).post(popup::destroy);
                  String scheme = uri.getScheme();
                  if (("http".equals(scheme) || "https".equals(scheme)) && isAllowedHost(uri.getHost())) {
                      webView.loadUrl(uri.toString());
                  } else {
                      notifyBlocked(uri);
                  }
              }

              private void notifyBlocked(Uri uri) {
                  long now = System.currentTimeMillis();
                  if (now - lastBlockedToast > 2500) {
                      lastBlockedToast = now;
                      Toast.makeText(this, "Blocked: " + uri.getHost(), Toast.LENGTH_SHORT).show();
                  }
              }

              private boolean looksLikeDownload(Uri uri) {
                  String path = uri.getPath();
                  if (path == null) {
                      return false;
                  }
                  String lower = path.toLowerCase(Locale.ROOT);
                  for (String ext : DOWNLOAD_EXTENSIONS) {
                      if (lower.endsWith(ext)) {
                          return true;
                      }
                  }
                  return false;
              }

