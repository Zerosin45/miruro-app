              private void showRecordMenu(View anchor, final DownloadCenter.Record r) {
                  android.widget.PopupMenu menu = new android.widget.PopupMenu(this, anchor);
                  menu.getMenu().add("Share");
                  menu.getMenu().add("Rename");
                  menu.getMenu().add("Delete");
                  menu.setOnMenuItemClickListener(item -> {
                      String t = item.getTitle().toString();
                      if (t.equals("Share")) {
                          shareRecord(r);
                      } else if (t.equals("Rename")) {
                          renameDialog(r);
                      } else {
                          deleteDialog(r);
                      }
                      return true;
                  });
                  menu.show();
              }

              private void openRecord(DownloadCenter.Record r) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(Uri.parse(r.uri), r.mime);
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(i);
                  } catch (Exception e) {
                      toastLong("No app on this phone can open this file");
                  }
              }

              private void shareRecord(DownloadCenter.Record r) {
                  try {
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType(r.mime);
                      i.putExtra(Intent.EXTRA_STREAM, Uri.parse(r.uri));
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(Intent.createChooser(i, "Share"));
                  } catch (Exception e) {
                      toastLong("Could not share this file");
                  }
              }

              private void renameDialog(final DownloadCenter.Record r) {
                  final android.widget.EditText input = new android.widget.EditText(this);
                  input.setText(r.name);
                  input.setSingleLine(true);
                  new AlertDialog.Builder(this)
                          .setTitle("Rename")
                          .setView(input)
                          .setPositiveButton("Rename", (d, which) -> {
                              String n = safeFileName(input.getText().toString());
                              if (!n.equals(r.name) && !center.renameRecord(r, n)) {
                                  toastLong("Could not rename this file");
                              }
                              refreshPanel();
                          })
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              private void deleteDialog(final DownloadCenter.Record r) {
                  new AlertDialog.Builder(this)
                          .setMessage("Delete " + r.name + " from this phone?")
                          .setPositiveButton("Delete", (d, which) -> {
                              center.deleteRecord(r);
                              refreshPanel();
                          })
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              private static String formatLeft(double secs) {
                  if (secs < 60) {
                      return "Less than a minute left";
                  }
                  long mins = (long) Math.ceil(secs / 60);
                  if (mins < 60) {
                      return mins + (mins == 1 ? " min left" : " mins left");
                  }
                  long hrs = mins / 60;
                  return hrs + (hrs == 1 ? " hr left" : " hrs left");
              }

              private void updateRow(final DownloadCenter.Job job, RowViews r) {
                  r.title.setText(job.name);
                  if (!r.thumbRequested) {
                      r.thumbRequested = true;
                      final android.widget.ImageView iv = r.thumb;
                      Thumbs.load(job.poster, bmp -> iv.setImageBitmap(bmp));
                  }
                  int state = job.state;
                  long bytes = job.bytes.get();
                  String info;
                  if (state == DownloadCenter.RUNNING) {
                      boolean paused = job.pause.get();
                      long now = SystemClock.elapsedRealtime();
                      if (r.lastTime == 0) {
                          r.lastTime = now;
                          r.lastBytes = bytes;
                      } else if (now - r.lastTime >= 1000) {
                          r.speed = (bytes - r.lastBytes) * 1000.0 / (now - r.lastTime);
                          r.lastBytes = bytes;
                          r.lastTime = now;
                      }
                      int total = job.total;
                      double est = -1;
                      if (total > 0 && job.done > 0) {
                          est = bytes * (double) total / job.done;
                          r.bar.setIndeterminate(false);
                          r.bar.setProgress((int) (job.done * 1000L / total));
                      } else {
                          r.bar.setIndeterminate(!paused);
                      }
                      StringBuilder sb = new StringBuilder();
                      if (paused) {
                          sb.append("Paused • ");
                      }
                      sb.append(formatBytes(bytes));
                      if (est > 0) {
                          sb.append(" / ").append(job.estimated ? "~" : "").append(formatBytes(est));
                      }
                      if (!paused) {
                          if (est > 0 && r.speed > 1024) {
                              sb.append(" • ").append(formatLeft((est - bytes) / r.speed));
                          } else {
                              sb.append(" • ").append(formatBytes(r.speed)).append("/s");
                          }
                      }
                      info = sb.toString();
                      r.action.setText(paused ? "▶" : "❚❚");
                      r.action.setOnClickListener(v -> center.togglePause(job));
                      r.close.setOnClickListener(v -> job.cancel.set(true));
                  } else {
                      r.bar.setIndeterminate(false);
                      r.bar.setProgress(0);
                      info = state == DownloadCenter.FAILED ? "Failed: " + job.message : "Stopped";
                      r.action.setText("↻");
                      r.action.setOnClickListener(v -> center.retry(job));
                      r.close.setOnClickListener(v -> {
                          center.remove(job);
                          refreshPanel();
                          updateDownloadButton();
                      });
                  }
                  r.info.setText(info);
              }

              private static String formatBytes(double b) {
                  if (b < 1024) {
                      return (long) b + " B";
                  }
                  double kb = b / 1024;
                  if (kb < 1024) {
                      return String.format(Locale.US, "%.0f KB", kb);
                  }
                  double mb = kb / 1024;
                  if (mb < 1024) {
                      return String.format(Locale.US, "%.1f MB", mb);
                  }
                  return String.format(Locale.US, "%.2f GB", mb / 1024);
              }

              @SuppressWarnings("deprecation")
              private void chooseFolder() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  try {
                      startActivityForResult(i, REQ_FOLDER);
                  } catch (ActivityNotFoundException e) {
                      toastLong("This phone has no folder picker");
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FOLDER && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      Uri uri = data.getData();
                      try {
                          getContentResolver().takePersistableUriPermission(uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      } catch (Exception ignored) {
                          // Some providers do not allow keeping access; it still works until the app closes.
                      }
                      center.setFolder(uri);
                      refreshPanel();
                      toastLong("New downloads will be saved to: " + center.folderLabel());
                  }
              }

              private void openExternally(Uri uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (ActivityNotFoundException ignored) {
                      // No app can handle this link; do nothing.
                  }
              }

              // ------------------------------------------------------------------ fullscreen video and lifecycle

              private void hideCustomView() {
                  if (customView == null) {
                      return;
                  }
                  root.removeView(customView);
                  customView = null;
                  webView.setVisibility(View.VISIBLE);
                  buttonBar.setVisibility(View.VISIBLE);
                  exitImmersive();
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  if (customViewCallback != null) {
                      customViewCallback.onCustomViewHidden();
                      customViewCallback = null;
                  }
                  // The phone's actual rotation may now call for a different site layout; catch up.
                  applySiteMode(getResources().getConfiguration().orientation == Configuration.ORIENTATION_LANDSCAPE);
              }

              @SuppressWarnings("deprecation")
              private void enterImmersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @SuppressWarnings("deprecation")
              private void exitImmersive() {
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (panel.getVisibility() == View.VISIBLE) {
                      hidePanel();
                  } else if (customView != null) {
                      hideCustomView();
                  } else if (webView.canGoBack()) {
                      webView.goBack();
                  } else if (center.activeCount() > 0) {
                      new AlertDialog.Builder(this)
                              .setMessage("Downloads are still running. Leave and stop them?")
                              .setPositiveButton("Stop and leave", (d, which) -> {
                                  center.cancelAll();
                                  finish();
                              })
                              .setNegativeButton("Stay", null)
                              .show();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  webView.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  webView.onResume();
              }

              @Override
              protected void onDestroy() {
                  center.cancelAll();
                  uiHandler.removeCallbacks(refresher);
                  root.removeAllViews();
                  webView.destroy();
                  super.onDestroy();
              }
          }
