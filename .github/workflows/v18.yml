                  java.util.Set<String> variantUrls = new java.util.HashSet<>();
                  for (Media m : items) {
                      if (!m.stream) {
                          Entry e = new Entry();
                          e.media = m;
                          e.media.poster = poster;
                          String ext = extensionOf(m.url);
                          long size = fileSize(m);
                          e.label = base + " - " + (size > 0 ? formatBytes(size) + " - " : "")
                                  + ext.substring(1).toUpperCase(Locale.ROOT);
                          e.height = 1;
                          out.add(e);
                          continue;
                      }
                      try {
                          HlsDownloader.Parsed p = HlsDownloader.load(m.url, m.headers, cookieProvider);
                          loaded.add(new Object[]{m, p});
                          if (p.variants != null) {
                              for (HlsDownloader.Variant v : p.variants) {
                                  variantUrls.add(v.url);
                              }
                          }
                      } catch (Exception ignored) {
                          // This address could not be read; skip it.
                      }
                  }
                  java.util.concurrent.ExecutorService pool = java.util.concurrent.Executors.newFixedThreadPool(4);
                  try {
                      List<java.util.concurrent.Callable<Entry>> jobs = new ArrayList<>();
                      for (Object[] pair : loaded) {
                          final Media m = (Media) pair[0];
                          final HlsDownloader.Parsed p = (HlsDownloader.Parsed) pair[1];
                          final String baseName = base;
                  final String posterFinal = poster;
                          if (p.variants != null) {
                              for (final HlsDownloader.Variant v : p.variants) {
                                  jobs.add(() -> variantEntry(m, v, baseName, poster));
                              }
                          } else if (p.media != null && !variantUrls.contains(m.url)) {
                              final HlsDownloader.MediaPlaylist mp = p.media;
                              jobs.add(() -> {
                                  Entry e = new Entry();
                                  e.media = new Media(m.url, true, m.headers);
                                  e.media.baseName = baseName;
                                  e.media.poster = posterFinal;
                                  e.playlist = mp;
                                  e.label = baseName + " - Stream - " + formatFormat(mp);
                                  return e;
                              });
                          }
                      }
                      for (java.util.concurrent.Future<Entry> f : pool.invokeAll(jobs)) {
                          try {
                              Entry e = f.get();
                              if (e != null) {
                                  out.add(e);
                              }
                          } catch (Exception ignored) {
                              // A quality that cannot be read is left out.
                          }
                      }
                  } catch (InterruptedException e) {
                      Thread.currentThread().interrupt();
                  } finally {
                      pool.shutdownNow();
                  }
                  Collections.sort(out, (x, y) -> Integer.compare(y.height, x.height));
                  return out;
              }

              private Entry variantEntry(Media m, HlsDownloader.Variant v, String base, String poster) {
                  try {
                      HlsDownloader.Parsed p = HlsDownloader.load(v.url, m.headers, cookieProvider);
                      if (p.media == null) {
                          return null;
                      }
                      int height = 0;
                      String quality = "Unknown quality";
                      if (v.resolution != null && v.resolution.contains("x")) {
                          try {
                              height = Integer.parseInt(v.resolution.substring(v.resolution.indexOf('x') + 1).trim());
                              quality = height + "p";
                          } catch (NumberFormatException ignored) {
                              // Keep "Unknown quality".
                          }
                      }
                      String size = "";
                      if (v.bandwidth > 0 && p.media.totalSeconds > 0) {
                          size = formatBytes(v.bandwidth * p.media.totalSeconds / 8.0) + " - ";
                      }
                      Entry e = new Entry();
                      e.media = new Media(v.url, true, m.headers);
                      e.media.baseName = base;
                      e.media.poster = poster;
                      e.playlist = p.media;
                      e.height = height;
                      e.label = base + " - " + quality + " - " + size + formatFormat(p.media);
                      return e;
                  } catch (Exception ex) {
                      return null;
                  }
              }

              private static String formatFormat(HlsDownloader.MediaPlaylist mp) {
                  return mp.initUrl != null ? "MP4" : "TS";
              }

              private long fileSize(Media m) {
                  try {
                      java.net.HttpURLConnection c = (java.net.HttpURLConnection) new java.net.URL(m.url).openConnection();
                      c.setRequestMethod("HEAD");
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(8000);
                      for (Map.Entry<String, String> h : m.headers.entrySet()) {
                          String k = h.getKey();
                          if ("User-Agent".equalsIgnoreCase(k) || "Referer".equalsIgnoreCase(k) || "Origin".equalsIgnoreCase(k)) {
                              c.setRequestProperty(k, h.getValue());
                          }
                      }
                      long n = c.getContentLengthLong();
                      c.disconnect();
                      return n;
                  } catch (Exception e) {
                      return -1;
                  }
              }

              private void showEntries(final List<Entry> entries) {
                  if (entries.isEmpty()) {
                      toastLong("Could not read the video. Play it for a few seconds, then try again.");
                      return;
                  }
                  String[] labels = new String[entries.size()];
                  for (int i = 0; i < labels.length; i++) {
                      labels[i] = entries.get(i).label;
                  }
                  new AlertDialog.Builder(this)
                          .setTitle("Choose video to save")
                          .setItems(labels, (dialog, which) -> {
                              Entry e = entries.get(which);
                              if (e.playlist != null) {
                                  beginStreamDownload(e.media, e.playlist);
                              } else if (canWrite()) {
                                  String name = safeFileName(e.media.baseName + extensionOf(e.media.url));
                                  center.addFile(name, mimeFor(name, null), e.media.url, e.media.headers, e.media.poster);
                                  addedToast(name);
                              }
                          })
                          .show();
              }

              private interface NameCallback {
                  void got(String baseName, String posterUrl);
              }

              /** Works out "Series name - Episode NN" from the page, then calls back on the UI thread. */
              private void resolveBaseName(final NameCallback callback) {
                  final String pageUrl = webView.getUrl() != null ? webView.getUrl() : "";
                  final String pageTitle = webView.getTitle() != null ? webView.getTitle() : "";
                  final boolean[] called = {false};
                  try {
                      webView.evaluateJavascript(
                              "(function(){var q=function(s){var e=document.querySelector(s);return e?(e.content||e.innerText||''):'';};"
                                      + "var re=/^\\s*(\\d{1,4})\\s*[.:\\-]\\s*\\S/;var ep='';"
                                      + "var hs=document.querySelectorAll('h1,h2,h3,h4,h5');"
                                      + "for(var i=0;i<hs.length&&!ep;i++){var m=(hs[i].innerText||'').match(re);if(m)ep=m[1];}"
                                      + "if(!ep){var all=document.querySelectorAll('div,span,p');"
                                      + "for(var j=0;j<all.length&&!ep;j++){var n=all[j];if(n.childElementCount)continue;"
                                      + "var tx=(n.innerText||'').trim();if(tx.length>120)continue;var m2=tx.match(re);if(m2)ep=m2[1];}}"
                                      + "return JSON.stringify({og:q('meta[property=\"og:title\"]'),h1:q('h1'),t:document.title,ep:ep,"
                                      + "img:q('meta[property=\"og:image\"]')});})()",
                              value -> {
                                  if (called[0]) {
                                      return;
                                  }
                                  called[0] = true;
                                  String og = "";
                                  String h1 = "";
                                  String t = pageTitle;
                                  String ep = "";
                                  String img = "";
                                  try {
                                      Object inner = new JSONTokener(value).nextValue();
                                      JSONObject o = new JSONObject(String.valueOf(inner));
                                      og = o.optString("og", "");
                                      h1 = o.optString("h1", "");
                                      t = o.optString("t", pageTitle);
                                      ep = o.optString("ep", "");
                                      img = o.optString("img", "");
                                  } catch (Exception ignored) {
                                      // Fall back to the page title only.
                                  }
                                  callback.got(buildName(og, t, h1, pageUrl, ep), img);
                              });
                  } catch (Exception e) {
                      called[0] = true;
                      callback.got(buildName("", pageTitle, "", pageUrl, ""), "");
                  }
              }

              private static final Pattern EP_TEXT =
                      Pattern.compile("(?i)\\b(?:episode|ep)\\.?\\s*#?0*(\\d{1,4})\\b");
              private static final Pattern EP_URL =
                      Pattern.compile("(?i)[/?&#-](?:ep|episode)[-_/=]0*(\\d{1,4})\\b");
              private static final Pattern PIECE_SPLIT =
                      Pattern.compile("\\s*[|\\u00B7\\u2022\\u2013\\u2014]\\s*|\\s+-\\s+");

              /** Series name and episode number from the page, as "Series - Episode 03". */
              static String buildName(String og, String docTitle, String h1, String url, String epHint) {
                  String episode = null;
                  if (epHint != null && epHint.matches("\\d{1,4}")) {
                      episode = String.valueOf(Integer.parseInt(epHint));
                  }
                  if (episode == null) {
                      Matcher um = EP_URL.matcher(url);
                      if (um.find()) {
                          episode = String.valueOf(Integer.parseInt(um.group(1)));
                      }
                  }
                  if (episode == null) {
                      try {
                          String q = Uri.parse(url).getQueryParameter("ep");
                          if (q == null) {
                              q = Uri.parse(url).getQueryParameter("episode");
                          }
                          if (q != null && q.matches("\\d{1,4}")) {
                              episode = String.valueOf(Integer.parseInt(q));
                          }
                      } catch (Exception ignored) {
                          // Not a normal address; try the text instead.
                      }
                  }
                  String series = "";
                  for (String c : new String[]{docTitle, og, h1}) {
                      if (c == null) {
                          continue;
                      }
                      for (String piece : PIECE_SPLIT.split(c)) {
                          String lower = piece.toLowerCase(Locale.ROOT);
                          if (lower.contains("anime online") || lower.contains("stream sub") || lower.contains("free anime")) {
                              continue; // the site's general slogan, not a series name
                          }
                          String head = piece;
                          Matcher m = EP_TEXT.matcher(piece);
                          if (m.find()) {
                              if (episode == null) {
                                  episode = String.valueOf(Integer.parseInt(m.group(1)));
                              }
                              head = piece.substring(0, m.start());
                          }
                          String cleaned = cleanSeries(head);
                          if (!cleaned.isEmpty() && series.isEmpty()) {
                              series = cleaned;
                          }
                      }
                  }
                  if (series.isEmpty()) {
                      series = slugTitle(url);
                  }
                  if (series.isEmpty()) {
                      series = "video";
                  }
                  if (episode != null) {
                      int n = Integer.parseInt(episode);
                      return series + " - Episode " + (n < 10 ? "0" + n : String.valueOf(n));
                  }
                  return series;
              }

              /** "/watch/<id>/one-piece" becomes "One Piece" (used only when the page title is no help). */
              private static String slugTitle(String url) {
                  try {
                      List<String> segs = Uri.parse(url).getPathSegments();
                      for (int i = 0; i < segs.size(); i++) {
                          String s = segs.get(i);
                          if ((s.equals("watch") || s.equals("info")) && i + 2 < segs.size()) {
                              String slug = segs.get(i + 2);
                              StringBuilder sb = new StringBuilder();
                              for (String w : slug.split("-")) {
                                  if (w.isEmpty()) {
                                      continue;
                                  }
                                  if (sb.length() > 0) {
                                      sb.append(' ');
                                  }
                                  sb.append(Character.toUpperCase(w.charAt(0))).append(w.substring(1));
                              }
                              return sb.toString();
                          }
                      }
                  } catch (Exception ignored) {
                      // No usable address.
                  }
                  return "";
              }

              private static String cleanSeries(String s) {
                  String r = s.replaceFirst("(?i)^\\s*watch\\s+", "");
                  r = r.replaceAll("(?i)\\bmiruro(\\.\\w+)?\\b", " ");
                  r = r.replaceAll("(?i)\\b(english\\s+(sub|dub)(bed)?|subbed|dubbed)\\b", " ");
                  r = r.replaceAll("[\\\\/:*?\"<>|\\p{Cntrl}]", " ").replaceAll("\\s+", " ").trim();
                  r = r.replaceAll("^[\\s\\-\\u2013\\u2014,]+|[\\s\\-\\u2013\\u2014,]+$", "");
                  if (r.length() > 80) {
                      r = r.substring(0, 80).trim();
                  }
                  return r;
              }

              private static String extensionOf(String url) {
                  String path = Uri.parse(url).getPath();
                  if (path != null) {
                      int dot = path.lastIndexOf('.');
                      if (dot >= 0 && path.length() - dot <= 6) {
                          return path.substring(dot).toLowerCase(Locale.ROOT);
                      }
                  }
                  return ".mp4";
              }

              private static String headerIgnoreCase(Map<String, String> headers, String name) {
                  for (Map.Entry<String, String> e : headers.entrySet()) {
                      if (e.getKey() != null && e.getKey().equalsIgnoreCase(name)) {
                          return e.getValue();
                      }
                  }
                  return null;
              }

              private void toastLong(String message) {
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show();
              }

              // ------------------------------------------------------------------ saving a chosen video

              private static String mimeFor(String name, String given) {
                  String lower = name.toLowerCase(Locale.ROOT);
                  if (lower.endsWith(".mp4") || lower.endsWith(".m4v")) {
                      return "video/mp4";
                  }
                  if (lower.endsWith(".webm")) {
                      return "video/webm";
                  }
                  if (lower.endsWith(".mkv")) {
                      return "video/x-matroska";
                  }
                  if (lower.endsWith(".ts")) {
                      return "video/mp2t";
                  }
                  if (given != null && !given.isEmpty()) {
                      return given;
                  }
                  return "application/octet-stream";
              }

              private static String safeFileName(String name) {
                  String n = name.replaceAll("[\\\\/:*?\"<>|\\p{Cntrl}]", "_").trim();
                  return n.isEmpty() ? "download" : n;
              }

              /** Adds the page address and browser name the video server may expect. */
              private Map<String, String> enrichedHeaders(Map<String, String> original, String userAgent,
                                                          String referer) {
                  Map<String, String> h = new HashMap<>(original);
                  if (headerIgnoreCase(h, "User-Agent") == null) {
                      h.put("User-Agent", userAgent != null ? userAgent : webView.getSettings().getUserAgentString());
                  }
                  if (headerIgnoreCase(h, "Referer") == null) {
                      String ref = referer != null ? referer : webView.getUrl();
                      if (ref != null) {
                          h.put("Referer", ref);
                      }
                  }
                  return h;
              }

              private void startMedia(Media m) {
                  final Media prepared = new Media(m.url, m.stream, enrichedHeaders(m.headers, null, null));
                  resolveBaseName((base, poster) -> {
                      prepared.baseName = base;
                      prepared.poster = poster;
                      if (!prepared.stream) {
                          if (!canWrite()) {
                              return;
                          }
                          String name = safeFileName(base + extensionOf(prepared.url));
                          center.addFile(name, mimeFor(name, null), prepared.url, prepared.headers, prepared.poster);
                          addedToast(name);
                          return;
                      }
                      Toast.makeText(this, "Reading stream...", Toast.LENGTH_SHORT).show();
                      loadPlaylist(prepared, prepared.url);
                  });
              }

              private void addedToast(String name) {
                  updateDownloadButton();
                  toastLong("Downloading " + name + ". Tap Downloads to see progress.");
              }

              /** Reads a playlist in the background, then continues with quality choice or download. */
              private void loadPlaylist(final Media m, final String playlistUrl) {
                  new Thread(() -> {
                      try {
                          final HlsDownloader.Parsed parsed = HlsDownloader.load(playlistUrl, m.headers, cookieProvider);
                          runOnUiThread(() -> onPlaylistLoaded(m, parsed));
                      } catch (Exception e) {
                          final String message = e.getMessage();
                          runOnUiThread(() -> toastLong("Could not read the stream: " + message));
                      }
                  }, "stream-read").start();
              }

              private void onPlaylistLoaded(final Media m, HlsDownloader.Parsed parsed) {
                  if (parsed.media != null) {
                      beginStreamDownload(m, parsed.media);
                      return;
                  }
                  final List<HlsDownloader.Variant> variants = new ArrayList<>(parsed.variants);
                  if (variants.isEmpty()) {
                      toastLong("No video found in this stream");
                      return;
                  }
                  Collections.sort(variants, (a, b) -> Long.compare(b.bandwidth, a.bandwidth));
                  if (variants.size() == 1) {
                      loadPlaylist(m, variants.get(0).url);
                      return;
                  }
                  String[] labels = new String[variants.size()];
                  for (int i = 0; i < labels.length; i++) {
                      labels[i] = variantLabel(variants.get(i));
                  }
                  new AlertDialog.Builder(this)
                          .setTitle("Choose quality")
                          .setItems(labels, (dialog, which) -> loadPlaylist(m, variants.get(which).url))
                          .show();
              }

              private static String variantLabel(HlsDownloader.Variant v) {
                  String size = v.resolution != null ? v.resolution : "Unknown size";
                  if (v.bandwidth > 0) {
                      long mbPerMinute = Math.max(1, v.bandwidth * 60 / 8 / 1000000);
                      return size + "  (about " + mbPerMinute + " MB per minute)";
                  }
                  return size;
              }

              private void beginStreamDownload(final Media m, final HlsDownloader.MediaPlaylist playlist) {
                  if (playlist.segments.isEmpty()) {
                      toastLong("No video parts found in this stream");
                      return;
                  }
                  if (!canWrite()) {
                      return;
                  }
                  boolean mp4 = playlist.initUrl != null;
                  String name = safeFileName(m.baseName + (mp4 ? ".mp4" : ".ts"));
                  center.addStream(name, mp4 ? "video/mp4" : "video/mp2t", playlist, m.headers, m.poster);
                  addedToast(name);
              }

              // ------------------------------------------------------------------ plain file downloads

              private boolean canWrite() {
                  if (center.hasCustomFolder()) {
                      return true;
                  }
                  if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P
                          && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, REQ_STORAGE);
                      toastLong("Allow storage access, then tap Download again");
                      return false;
                  }
                  return true;
              }

              private void startDownload(String url, String userAgent, String contentDisposition,
                                         String mimeType) {
                  startDownload(url, userAgent, contentDisposition, mimeType, null, null);
              }

              private void startDownload(String url, String userAgent, String contentDisposition,
                                         String mimeType, String referer, String fileName) {
                  if (url == null || !(url.startsWith("http://") || url.startsWith("https://"))) {
                      toastLong("This type of download is not supported yet");
                      return;
                  }
                  if (!canWrite()) {
                      return;
                  }
                  String name = safeFileName(fileName != null ? fileName
                          : URLUtil.guessFileName(url, contentDisposition, mimeType));
                  Map<String, String> headers = enrichedHeaders(new HashMap<String, String>(), userAgent, referer);
                  center.addFile(name, mimeFor(name, mimeType), url, headers, "");
                  addedToast(name);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                  if (requestCode == REQ_STORAGE && !granted) {
                      toastLong("Storage permission is needed to save videos");
                  }
              }

              // ------------------------------------------------------------------ downloads screen

              private TextView iconButton(String symbol, View.OnClickListener l) {
                  TextView t = new TextView(this);
                  t.setText(symbol);
                  t.setTextColor(0xFFE0E0E0);
                  t.setTextSize(22);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(dp(12), dp(8), dp(12), dp(8));
                  t.setOnClickListener(l);
                  return t;
              }

              private TextView makeChip(String label, final int index) {
                  TextView t = new TextView(this);
                  t.setTextSize(14);
                  t.setPadding(dp(14), dp(8), dp(14), dp(8));
                  t.setTag(label);
                  t.setOnClickListener(v -> {
                      filter = index;
                      updateChips();
                      refreshPanel();
                  });
                  return t;
              }

              private void updateChips() {
                  for (int i = 0; i < chips.length; i++) {
                      TextView t = chips[i];
                      boolean on = i == filter;
                      GradientDrawable bg = new GradientDrawable();
                      bg.setCornerRadius(dp(10));
                      if (on) {
                          bg.setColor(0xFF5C3B3B);
                          t.setTextColor(0xFFFFDAD6);
                      } else {
                          bg.setColor(0x00000000);
                          bg.setStroke(dp(1), 0xFF5A5A5A);
                          t.setTextColor(0xFFE0E0E0);
                      }
                      t.setBackground(bg);
                      t.setText((on ? "✓ " : "") + t.getTag());
                  }
              }

              @Override
              public void onConfigurationChanged(Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  applySiteMode(newConfig.orientation == Configuration.ORIENTATION_LANDSCAPE);
              }

              // Landscape (rotated sideways) switches the page to its desktop layout, the way a desktop
              // browser's "Desktop site" toggle does; portrait switches it back to the normal mobile layout.
              private void applySiteMode(boolean desktop) {
                  if (webView == null || customView != null || Boolean.valueOf(desktop).equals(desktopSite)) {
                      // While a video is fullscreen, the rotation is the player's own doing, not
                      // a real rotation of the phone, so the page is left alone and not reloaded.
                      return;
                  }
                  desktopSite = desktop;
                  WebSettings s = webView.getSettings();
                  s.setUserAgentString(desktop ? DESKTOP_USER_AGENT : mobileUserAgent);
                  s.setUseWideViewPort(desktop);
                  s.setLoadWithOverviewMode(desktop);
                  if (webView.getUrl() != null) {
                      // Remember where the video was, then put it back once the reloaded page is ready.
                      webView.evaluateJavascript(
                              "(function(){var v=document.querySelector('video');"
                                      + "return v&&!v.ended?v.currentTime:-1;})()",
                              value -> {
                                  try {
                                      resumeSeconds = Double.parseDouble(value);
                                  } catch (Exception ignored) {
                                      resumeSeconds = -1;
                                  }
                                  webView.reload();
                              });
                  }
              }

              private void buildPanel() {
                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setBackgroundColor(0xFF121212);
                  panel.setPadding(dp(20), dp(24), dp(20), dp(12));
                  panel.setClickable(true); // keeps taps from reaching the web page underneath
                  panel.setVisibility(View.GONE);

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  TextView title = new TextView(this);
                  title.setText("Downloads");
                  title.setTextColor(0xFFEDEDED);
                  title.setTextSize(28);
                  header.addView(title, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  header.addView(iconButton("⚙", v -> showSettingsMenu(v)));
                  header.addView(iconButton("🔍", v -> toggleSearch()));
                  header.addView(iconButton("✕", v -> hidePanel()));
                  panel.addView(header);

                  searchBox = new android.widget.EditText(this);
                  searchBox.setHint("Search downloads");
                  searchBox.setHintTextColor(0xFF8A8D96);
                  searchBox.setTextColor(0xFFEDEDED);
                  searchBox.setSingleLine(true);
                  searchBox.setVisibility(View.GONE);
                  searchBox.addTextChangedListener(new android.text.TextWatcher() {
                      @Override
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {
                      }

                      @Override
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                          query = s.toString().trim().toLowerCase(Locale.ROOT);
                          refreshPanel();
                      }

                      @Override
                      public void afterTextChanged(android.text.Editable s) {
                      }
                  });
                  panel.addView(searchBox);

                  storageLabel = new TextView(this);
                  storageLabel.setTextColor(0xFFB8BCC8);
                  storageLabel.setTextSize(14);
                  storageLabel.setPadding(0, dp(14), 0, dp(12));
                  panel.addView(storageLabel);

                  View divider = new View(this);
                  divider.setBackgroundColor(0xFF3A3A3A);
                  panel.addView(divider, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(1)));

                  folderLabel = new TextView(this);
                  folderLabel.setTextColor(0xFF8A8D96);
                  folderLabel.setTextSize(12);
                  folderLabel.setPadding(0, dp(8), 0, dp(8));
                  panel.addView(folderLabel);

                  LinearLayout chipRow = new LinearLayout(this);
                  chipRow.setOrientation(LinearLayout.HORIZONTAL);
                  String[] names = {"All", "Videos", "Other"};
                  for (int i = 0; i < names.length; i++) {
                      chips[i] = makeChip(names[i], i);
                      LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      cp.rightMargin = dp(8);
                      chipRow.addView(chips[i], cp);
                  }
                  updateChips();
                  panel.addView(chipRow);

                  emptyLabel = new TextView(this);
                  emptyLabel.setText("No downloads yet. Play a video and tap the Download button.");
                  emptyLabel.setTextColor(0xFFB8BCC8);
                  emptyLabel.setTextSize(14);
                  emptyLabel.setPadding(0, dp(24), 0, 0);
                  panel.addView(emptyLabel);

                  ScrollView scroll = new ScrollView(this);
                  listBox = new LinearLayout(this);
                  listBox.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(listBox, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  panel.addView(scroll, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  root.addView(panel, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              }

              private void showSettingsMenu(View anchor) {
                  android.widget.PopupMenu menu = new android.widget.PopupMenu(this, anchor);
                  menu.getMenu().add("Choose download folder");
                  menu.getMenu().add("Use Downloads folder");
                  menu.setOnMenuItemClickListener(item -> {
                      if (item.getTitle().toString().startsWith("Choose")) {
                          chooseFolder();
                      } else {
                          center.resetFolder();
                          refreshPanel();
                      }
                      return true;
                  });
                  menu.show();
              }

              private void toggleSearch() {
                  boolean show = searchBox.getVisibility() != View.VISIBLE;
                  searchBox.setVisibility(show ? View.VISIBLE : View.GONE);
                  if (show) {
                      searchBox.requestFocus();
                      android.view.inputmethod.InputMethodManager imm =
                              (android.view.inputmethod.InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                      if (imm != null) {
                          imm.showSoftInput(searchBox, 0);
                      }
                  } else {
                      searchBox.setText("");
                  }
              }

              private void showPanel() {
                  panel.setVisibility(View.VISIBLE);
                  panel.bringToFront();
                  buttonBar.setVisibility(View.GONE);
                  lastSig = "";
                  center.pruneMissing();
                  refreshPanel();
                  uiHandler.removeCallbacks(refresher);
                  uiHandler.postDelayed(refresher, 500);
              }

              private void hidePanel() {
                  panel.setVisibility(View.GONE);
                  buttonBar.setVisibility(View.VISIBLE);
                  uiHandler.removeCallbacks(refresher);
                  updateDownloadButton();
              }

              private boolean matches(String name, String mime) {
                  boolean video = mime != null && mime.startsWith("video/");
                  if (filter == 1 && !video) {
                      return false;
                  }
                  if (filter == 2 && video) {
                      return false;
                  }
                  return query.isEmpty() || name.toLowerCase(Locale.ROOT).contains(query);
              }

              private void refreshPanel() {
                  List<DownloadCenter.Job> jobs = new ArrayList<>();
                  for (DownloadCenter.Job j : center.jobs()) {
                      if (matches(j.name, j.mime)) {
                          jobs.add(j);
                      }
                  }
                  List<DownloadCenter.Record> recs = new ArrayList<>();
                  for (DownloadCenter.Record r : center.records()) {
                      if (matches(r.name, r.mime)) {
                          recs.add(r);
                      }
                  }
                  StringBuilder sig = new StringBuilder();
                  sig.append(filter).append('|').append(query);
                  for (DownloadCenter.Job j : jobs) {
                      sig.append("|j").append(j.id).append('-').append(j.state);
                  }
                  for (DownloadCenter.Record r : recs) {
                      sig.append("|r").append(r.uri).append('-').append(r.name);
                  }
                  String s = sig.toString();
                  if (!s.equals(lastSig)) {
                      lastSig = s;
                      rebuildList(jobs, recs);
                  }
                  for (DownloadCenter.Job j : jobs) {
                      RowViews rv = rows.get(j);
                      if (rv != null) {
                          updateRow(j, rv);
                      }
                  }
                  long total = DownloadCenter.deviceTotal();
                  storageLabel.setText("Using " + formatBytes(center.usedBytes())
                          + (total > 0 ? " of " + formatBytes(total) : ""));
                  folderLabel.setText("Saving to: " + center.folderLabel());
                  emptyLabel.setVisibility(jobs.isEmpty() && recs.isEmpty() ? View.VISIBLE : View.GONE);
              }

              private void rebuildList(List<DownloadCenter.Job> jobs, List<DownloadCenter.Record> recs) {
                  listBox.removeAllViews();
                  rows.clear();
                  String last = null;
                  if (!jobs.isEmpty()) {
                      addSection("Just now");
                      last = "Just now";
                      for (DownloadCenter.Job j : jobs) {
                          rows.put(j, addJobCard());
                      }
                  }
                  for (DownloadCenter.Record r : recs) {
                      String g = groupLabel(r.time);
                      if (!g.equals(last)) {
                          addSection(g);
                          last = g;
                      }
                      addRecordRow(r);
                  }
              }

              private static String groupLabel(long time) {
                  if (System.currentTimeMillis() - time < 10 * 60 * 1000L) {
                      return "Just now";
                  }
                  java.util.Calendar now = java.util.Calendar.getInstance();
                  java.util.Calendar then = java.util.Calendar.getInstance();
                  then.setTimeInMillis(time);
                  if (now.get(java.util.Calendar.YEAR) == then.get(java.util.Calendar.YEAR)
                          && now.get(java.util.Calendar.DAY_OF_YEAR) == then.get(java.util.Calendar.DAY_OF_YEAR)) {
                      return "Today";
                  }
                  now.add(java.util.Calendar.DAY_OF_YEAR, -1);
                  if (now.get(java.util.Calendar.YEAR) == then.get(java.util.Calendar.YEAR)
                          && now.get(java.util.Calendar.DAY_OF_YEAR) == then.get(java.util.Calendar.DAY_OF_YEAR)) {
                      return "Yesterday";
                  }
                  return new java.text.SimpleDateFormat("MMM d, yyyy", Locale.US).format(new java.util.Date(time));
              }

