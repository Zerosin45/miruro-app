              <color name="app_background">#0F1115</color>
              <color name="ic_launcher_background">#0F1115</color>
          </resources>
          EOF_FILE
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Miruro</string>
          </resources>
          EOF_FILE
          cat > app/src/main/res/values/themes.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@color/app_background</item>
                  <item name="android:statusBarColor">@color/app_background</item>
                  <item name="android:navigationBarColor">@color/app_background</item>
              </style>
          </resources>
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF_FILE
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MiruroApp"
          include(":app")
          EOF_FILE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk MiruroApp.apk

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiruroApp-apk
          path: MiruroApp.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_id }}" MiruroApp.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Miruro app build ${{ github.run_number }}" \
            --notes "Download MiruroApp.apk below and install it on your Android phone."
