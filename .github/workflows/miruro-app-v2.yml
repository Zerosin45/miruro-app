# Miruro Android app: one-file builder.
# This single file creates the whole Android project, builds the APK, and publishes it
# on the repository's Releases page (Releases -> latest -> MiruroApp.apk).
# Edit START_URL inside MainActivity.java below to change the site.
name: Build Miruro APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create the Android project
        run: |
          mkdir -p proj
          cd proj
          mkdir -p app
          mkdir -p app/src/main
          mkdir -p app/src/main/java/com/example/miruroapp
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.miruroapp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.miruroapp"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|navigation"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF_FILE
          cat > app/src/main/java/com/example/miruroapp/HlsDownloader.java <<'EOF_FILE'
          package com.example.miruroapp;

          import java.io.BufferedInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.concurrent.atomic.AtomicBoolean;

          import javax.crypto.Cipher;
          import javax.crypto.spec.IvParameterSpec;
          import javax.crypto.spec.SecretKeySpec;

          /**
           * Saves an HLS (.m3u8) stream by fetching every part and joining them in order.
           * Uses no Android classes, so it can be tested on a normal computer.
           */
          final class HlsDownloader {

              interface CookieProvider {
                  String cookieFor(String url);
              }

              interface Progress {
                  void onProgress(int done, int total);
              }

              static final class CancelledException extends IOException {
                  CancelledException() {
                      super("Cancelled");
                  }
              }

              static final class Variant {
                  final String url;
                  final long bandwidth;
                  final String resolution;

                  Variant(String url, long bandwidth, String resolution) {
                      this.url = url;
                      this.bandwidth = bandwidth;
                      this.resolution = resolution;
                  }
              }

              static final class Key {
                  final String url;
                  final byte[] iv; // null means "use the part's sequence number"

                  Key(String url, byte[] iv) {
                      this.url = url;
                      this.iv = iv;
                  }
              }

              static final class Segment {
                  final String url;
                  final long sequence;
                  final Key key; // null when the part is not encrypted
                  final long rangeStart; // -1 when the whole file is used
                  final long rangeLength;

                  Segment(String url, long sequence, Key key, long rangeStart, long rangeLength) {
                      this.url = url;
                      this.sequence = sequence;
                      this.key = key;
                      this.rangeStart = rangeStart;
                      this.rangeLength = rangeLength;
                  }
              }

              static final class MediaPlaylist {
                  final List<Segment> segments = new ArrayList<>();
                  String initUrl; // set for fragmented MP4 streams
                  long initRangeStart = -1;
                  long initRangeLength = -1;
                  boolean ended;
              }

              static final class Parsed {
                  List<Variant> variants; // set for a master playlist (list of qualities)
                  MediaPlaylist media; // set for a media playlist (list of video parts)
              }

              private static final String[] FORWARDED_HEADERS = {
                      "User-Agent", "Referer", "Origin", "Accept-Language", "Authorization"
              };
              private static final int MAX_SEGMENT_BYTES = 150 * 1024 * 1024;
              private static final int MAX_PLAYLIST_BYTES = 8 * 1024 * 1024;

              private HlsDownloader() {
              }

              // ------------------------------------------------------------------ loading / parsing

              static Parsed load(String url, Map<String, String> headers, CookieProvider cookies)
                      throws IOException {
                  HttpURLConnection c = connect(url, headers, cookies, -1, -1);
                  // Relative links inside a playlist are relative to its final address after redirects.
                  String finalUrl = c.getURL().toString();
                  byte[] data;
                  try (InputStream in = c.getInputStream()) {
                      data = drain(in, MAX_PLAYLIST_BYTES);
                  } finally {
                      c.disconnect();
                  }
                  return parse(finalUrl, new String(data, StandardCharsets.UTF_8));
              }

              private static byte[] drain(InputStream in, int max) throws IOException {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[16 * 1024];
                  int n;
                  while ((n = in.read(buf)) != -1) {
                      bo.write(buf, 0, n);
                      if (bo.size() > max) {
                          throw new IOException("Response is too large");
                      }
                  }
                  return bo.toByteArray();
              }

              static Parsed parse(String baseUrl, String text) throws IOException {
                  if (text.startsWith("﻿")) {
                      text = text.substring(1);
                  }
                  if (!text.trim().startsWith("#EXTM3U")) {
                      throw new IOException("This is not a video playlist");
                  }
                  String[] lines = text.replace("\r", "").split("\n");
                  Parsed parsed = new Parsed();
                  if (text.contains("#EXT-X-STREAM-INF")) {
                      parsed.variants = parseMaster(baseUrl, lines);
                  } else {
                      parsed.media = parseMedia(baseUrl, lines);
                  }
                  return parsed;
              }

              private static List<Variant> parseMaster(String base, String[] lines) throws IOException {
                  List<Variant> variants = new ArrayList<>();
                  Map<String, String> pending = null;
                  for (String raw : lines) {
                      String line = raw.trim();
                      if (line.isEmpty()) {
                          continue;
                      }
                      if (line.startsWith("#EXT-X-STREAM-INF:")) {
                          pending = parseAttributes(line.substring(line.indexOf(':') + 1));
                      } else if (line.startsWith("#")) {
                          continue;
                      } else if (pending != null) {
                          long bandwidth = parseLong(pending.get("BANDWIDTH"), -1);
                          if (bandwidth < 0) {
                              bandwidth = parseLong(pending.get("AVERAGE-BANDWIDTH"), -1);
                          }
                          variants.add(new Variant(resolve(base, line), bandwidth, pending.get("RESOLUTION")));
                          pending = null;
                      }
                  }
                  return variants;
              }

              private static MediaPlaylist parseMedia(String base, String[] lines) throws IOException {
                  MediaPlaylist playlist = new MediaPlaylist();
                  long sequence = 0;
                  Key key = null;
                  long pendingLength = -1;
                  long pendingOffset = -1;
                  String lastRangeUrl = null;
                  long lastRangeEnd = 0;

                  for (String raw : lines) {
                      String line = raw.trim();
                      if (line.isEmpty()) {
                          continue;
                      }
                      if (line.startsWith("#EXT-X-MEDIA-SEQUENCE:")) {
                          sequence = parseLong(line.substring(line.indexOf(':') + 1).trim(), 0);
                      } else if (line.startsWith("#EXT-X-KEY:")) {
                          Map<String, String> attrs = parseAttributes(line.substring(line.indexOf(':') + 1));
                          String method = attrs.get("METHOD");
                          String keyFormat = attrs.get("KEYFORMAT");
                          if (method == null || "NONE".equalsIgnoreCase(method)) {
                              key = null;
                          } else if ("AES-128".equalsIgnoreCase(method)
                                  && (keyFormat == null || "identity".equalsIgnoreCase(keyFormat))
                                  && attrs.get("URI") != null) {
                              key = new Key(resolve(base, attrs.get("URI")), parseIv(attrs.get("IV")));
                          } else {
                              throw new IOException("This stream uses " + method
                                      + " protection, which cannot be saved");
                          }
                      } else if (line.startsWith("#EXT-X-MAP:")) {
                          Map<String, String> attrs = parseAttributes(line.substring(line.indexOf(':') + 1));
                          if (attrs.get("URI") != null) {
                              playlist.initUrl = resolve(base, attrs.get("URI"));
                              String range = attrs.get("BYTERANGE");
                              if (range != null) {
                                  long[] r = parseRange(range);
                                  playlist.initRangeLength = r[0];
                                  playlist.initRangeStart = r[1] >= 0 ? r[1] : 0;
                              }
                          }
                      } else if (line.startsWith("#EXT-X-BYTERANGE:")) {
                          long[] r = parseRange(line.substring(line.indexOf(':') + 1).trim());
                          pendingLength = r[0];
                          pendingOffset = r[1];
                      } else if (line.startsWith("#EXT-X-ENDLIST")) {
                          playlist.ended = true;
                      } else if (line.startsWith("#")) {
                          continue;
                      } else {
                          String segmentUrl = resolve(base, line);
                          long rangeStart = -1;
                          long rangeLength = -1;
                          if (pendingLength >= 0) {
                              rangeLength = pendingLength;
                              if (pendingOffset >= 0) {
                                  rangeStart = pendingOffset;
                              } else {
                                  rangeStart = segmentUrl.equals(lastRangeUrl) ? lastRangeEnd : 0;
                              }
                              lastRangeUrl = segmentUrl;
                              lastRangeEnd = rangeStart + rangeLength;
                              pendingLength = -1;
                              pendingOffset = -1;
                          }
                          playlist.segments.add(new Segment(segmentUrl, sequence, key, rangeStart, rangeLength));
                          sequence++;
                      }
                  }
                  return playlist;
              }

              /** Parses "length" or "length@offset"; returns {length, offset or -1}. */
              private static long[] parseRange(String s) {
                  String value = s.trim();
                  int at = value.indexOf('@');
                  if (at < 0) {
                      return new long[]{parseLong(value, -1), -1};
                  }
                  return new long[]{parseLong(value.substring(0, at), -1), parseLong(value.substring(at + 1), -1)};
              }

              static Map<String, String> parseAttributes(String s) {
                  Map<String, String> map = new HashMap<>();
                  int i = 0;
                  int n = s.length();
                  while (i < n) {
                      int eq = s.indexOf('=', i);
                      if (eq < 0) {
                          break;
                      }
                      String name = s.substring(i, eq).trim().toUpperCase(Locale.ROOT);
                      int j = eq + 1;
                      String value;
                      if (j < n && s.charAt(j) == '"') {
                          int end = s.indexOf('"', j + 1);
                          if (end < 0) {
                              end = n;
                          }
                          value = s.substring(j + 1, end);
                          i = end + 1;
                      } else {
                          int end = s.indexOf(',', j);
                          if (end < 0) {
                              end = n;
                          }
                          value = s.substring(j, end).trim();
                          i = end;
                      }
                      if (i < n && s.charAt(i) == ',') {
                          i++;
                      }
                      map.put(name, value);
                  }
                  return map;
              }

              private static long parseLong(String s, long fallback) {
                  if (s == null) {
                      return fallback;
                  }
                  try {
                      return Long.parseLong(s.trim());
                  } catch (NumberFormatException e) {
                      return fallback;
                  }
              }

              private static byte[] parseIv(String s) throws IOException {
                  if (s == null) {
                      return null;
                  }
                  String hex = (s.startsWith("0x") || s.startsWith("0X")) ? s.substring(2) : s;
                  if (hex.length() % 2 == 1) {
                      hex = "0" + hex;
                  }
                  byte[] raw = new byte[hex.length() / 2];
                  try {
                      for (int i = 0; i < raw.length; i++) {
                          raw[i] = (byte) Integer.parseInt(hex.substring(i * 2, i * 2 + 2), 16);
                      }
                  } catch (NumberFormatException e) {
                      throw new IOException("Bad encryption settings in the playlist");
                  }
                  byte[] iv = new byte[16];
                  int copy = Math.min(16, raw.length);
                  System.arraycopy(raw, raw.length - copy, iv, 16 - copy, copy);
                  return iv;
              }

              static String resolve(String base, String ref) throws IOException {
                  return new URL(new URL(base), ref.trim()).toString();
              }

              // ------------------------------------------------------------------ downloading

              static void download(MediaPlaylist playlist, OutputStream out, Map<String, String> headers,
                                   CookieProvider cookies, Progress progress, AtomicBoolean cancel)
                      throws IOException {
                  if (playlist.segments.isEmpty()) {
                      throw new IOException("The playlist has no video parts");
                  }
                  Map<String, byte[]> keyCache = new HashMap<>();
                  if (playlist.initUrl != null) {
                      byte[] init = fetchWithRetry(playlist.initUrl, playlist.initRangeStart,
                              playlist.initRangeLength, null, 0, headers, cookies, keyCache, cancel);
                      out.write(init);
                  }
                  int total = playlist.segments.size();
                  for (int i = 0; i < total; i++) {
                      checkCancel(cancel);
                      Segment s = playlist.segments.get(i);
                      byte[] data = fetchWithRetry(s.url, s.rangeStart, s.rangeLength, s.key, s.sequence,
                              headers, cookies, keyCache, cancel);
                      out.write(data);
                      if (progress != null) {
                          progress.onProgress(i + 1, total);
                      }
                  }
              }

              private static void checkCancel(AtomicBoolean cancel) throws CancelledException {
                  if (cancel != null && cancel.get()) {
                      throw new CancelledException();
                  }
              }

              private static byte[] fetchWithRetry(String url, long rangeStart, long rangeLength, Key key,
                                                   long sequence, Map<String, String> headers,
                                                   CookieProvider cookies, Map<String, byte[]> keyCache,
                                                   AtomicBoolean cancel) throws IOException {
                  IOException last = null;
                  for (int attempt = 0; attempt < 3; attempt++) {
                      checkCancel(cancel);
                      try {
                          return fetchOnce(url, rangeStart, rangeLength, key, sequence, headers, cookies, keyCache);
                      } catch (CancelledException e) {
                          throw e;
                      } catch (IOException e) {
                          last = e;
                          try {
                              Thread.sleep(1000L * (attempt + 1));
                          } catch (InterruptedException ie) {
                              Thread.currentThread().interrupt();
                              throw new CancelledException();
                          }
                      }
                  }
                  throw last;
              }

              private static byte[] fetchOnce(String url, long rangeStart, long rangeLength, Key key,
                                              long sequence, Map<String, String> headers,
                                              CookieProvider cookies, Map<String, byte[]> keyCache)
                      throws IOException {
                  HttpURLConnection c = connect(url, headers, cookies, rangeStart, rangeLength);
                  byte[] raw;
                  try {
                      int code = c.getResponseCode();
                      InputStream in = new BufferedInputStream(c.getInputStream());
                      long limit = -1;
                      if (rangeLength >= 0) {
                          if (code == 200) {
                              skipFully(in, rangeStart); // the server ignored the Range request
                          }
                          limit = rangeLength;
                      }
                      ByteArrayOutputStream bo = new ByteArrayOutputStream(limit > 0 && limit < MAX_SEGMENT_BYTES
                              ? (int) limit : 256 * 1024);
                      byte[] buf = new byte[64 * 1024];
                      long remaining = limit;
                      while (limit < 0 || remaining > 0) {
                          int want = limit < 0 ? buf.length : (int) Math.min(buf.length, remaining);
                          int n = in.read(buf, 0, want);
                          if (n < 0) {
                              break;
                          }
                          bo.write(buf, 0, n);
                          if (limit >= 0) {
                              remaining -= n;
                          }
                          if (bo.size() > MAX_SEGMENT_BYTES) {
                              throw new IOException("A video part is too large");
                          }
                      }
                      raw = bo.toByteArray();
                  } finally {
                      c.disconnect();
                  }
                  if (key == null) {
                      return raw;
                  }
                  byte[] keyBytes = keyCache.get(key.url);
                  if (keyBytes == null) {
                      keyBytes = readAll(key.url, headers, cookies, 1024);
                      if (keyBytes.length != 16) {
                          throw new IOException("Unexpected encryption key size");
                      }
                      keyCache.put(key.url, keyBytes);
                  }
                  try {
                      Cipher cipher = Cipher.getInstance("AES/CBC/PKCS5Padding");
                      cipher.init(Cipher.DECRYPT_MODE, new SecretKeySpec(keyBytes, "AES"),
                              new IvParameterSpec(ivFor(key, sequence)));
                      return cipher.doFinal(raw);
                  } catch (Exception e) {
                      throw new IOException("Could not decrypt a video part");
                  }
              }

              private static byte[] ivFor(Key key, long sequence) {
                  if (key.iv != null) {
                      return key.iv;
                  }
                  byte[] iv = new byte[16];
                  for (int i = 0; i < 8; i++) {
                      iv[15 - i] = (byte) (sequence >>> (8 * i));
                  }
                  return iv;
              }

              private static void skipFully(InputStream in, long count) throws IOException {
                  long left = count;
                  byte[] tmp = new byte[16 * 1024];
                  while (left > 0) {
                      long skipped = in.skip(left);
                      if (skipped <= 0) {
                          int n = in.read(tmp, 0, (int) Math.min(tmp.length, left));
                          if (n < 0) {
                              throw new IOException("Unexpected end of data");
                          }
                          skipped = n;
                      }
                      left -= skipped;
                  }
              }

              // ------------------------------------------------------------------ http

              private static byte[] readAll(String url, Map<String, String> headers, CookieProvider cookies,
                                            int max) throws IOException {
                  HttpURLConnection c = connect(url, headers, cookies, -1, -1);
                  try (InputStream in = c.getInputStream()) {
                      return drain(in, max);
                  } finally {
                      c.disconnect();
                  }
              }

              private static HttpURLConnection connect(String url, Map<String, String> headers,
                                                       CookieProvider cookies, long rangeStart,
                                                       long rangeLength) throws IOException {
                  String current = url;
                  for (int hop = 0; hop < 6; hop++) {
                      HttpURLConnection c = (HttpURLConnection) new URL(current).openConnection();
                      c.setInstanceFollowRedirects(false);
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(30000);
                      if (headers != null) {
                          for (String name : FORWARDED_HEADERS) {
                              String value = headerIgnoreCase(headers, name);
                              if (value != null) {
                                  c.setRequestProperty(name, value);
                              }
                          }
                      }
                      if (cookies != null) {
                          String cookie = cookies.cookieFor(current);
                          if (cookie != null && !cookie.isEmpty()) {
                              c.setRequestProperty("Cookie", cookie);
                          }
                      }
                      if (rangeStart >= 0 && rangeLength >= 0) {
                          c.setRequestProperty("Range", "bytes=" + rangeStart + "-" + (rangeStart + rangeLength - 1));
                      }
                      c.setRequestProperty("Accept-Encoding", "identity");
                      int code = c.getResponseCode();
                      if (code == 301 || code == 302 || code == 303 || code == 307 || code == 308) {
                          String location = c.getHeaderField("Location");
                          c.disconnect();
                          if (location == null) {
                              throw new IOException("Redirect without a target");
                          }
                          current = resolve(current, location);
                          continue;
                      }
                      if (code == 200 || code == 206) {
                          return c;
                      }
                      c.disconnect();
                      throw new IOException("The server answered " + code);
                  }
                  throw new IOException("Too many redirects");
              }

              private static String headerIgnoreCase(Map<String, String> headers, String name) {
                  for (Map.Entry<String, String> e : headers.entrySet()) {
                      if (e.getKey() != null && e.getKey().equalsIgnoreCase(name)) {
                          return e.getValue();
                      }
                  }
                  return null;
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/example/miruroapp/MainActivity.java <<'EOF_FILE'
          package com.example.miruroapp;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.DownloadManager;
          import android.content.ActivityNotFoundException;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.drawable.GradientDrawable;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Message;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.BufferedOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.concurrent.atomic.AtomicBoolean;

          public class MainActivity extends Activity {

              // ---- Edit these lines to change the site and which sites may open inside the app ----
              private static final String START_URL = "https://www.miruro.ru/";
              // Pages on these sites (and their subdomains) open in the app. Everything else is
              // blocked (ads, pop-ups, redirects). Add a login provider here if its page gets blocked.
              private static final String[] ALLOWED_HOSTS = {
                      "miruro.ru", "anilist.co", "myanimelist.net", "discord.com", "google.com", "ultracloud.cc"
              };
              // -------------------------------------------------------------------------------------

              private static final int REQ_STORAGE = 1001;
              private static final int REQ_STORAGE_STREAM = 1002;

              private static final String[] DOWNLOAD_EXTENSIONS = {
                      ".mp4", ".mkv", ".webm", ".avi", ".mov", ".m4v", ".mp3", ".zip", ".rar", ".7z", ".srt", ".ass", ".vtt"
              };

              private static final String ERROR_HTML =
                      "<html><head><meta name='viewport' content='width=device-width, initial-scale=1'></head>"
                              + "<body style='background:#0f1115;color:#e6e6e6;font-family:sans-serif;"
                              + "text-align:center;padding-top:30vh'>"
                              + "<h2>Can't reach the site</h2><p>Check your internet connection.</p>"
                              + "<a href='" + START_URL + "' style='color:#a78bfa;font-size:1.2em'>Try again</a>"
                              + "</body></html>";

              /** A video address the page asked for (a stream playlist or a plain video file). */
              private static final class Media {
                  final String url;
                  final boolean stream;
                  final Map<String, String> headers;

                  Media(String url, boolean stream, Map<String, String> headers) {
                      this.url = url;
                      this.stream = stream;
                      this.headers = headers;
                  }
              }

              /** Where a stream download is being written. */
              private static final class Output {
                  OutputStream stream;
                  Uri uri;
                  File file;
              }

              private FrameLayout root;
              private WebView webView;
              private ProgressBar progressBar;
              private TextView downloadButton;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;

              private final List<Media> detected = new ArrayList<>();
              private final HlsDownloader.CookieProvider cookieProvider =
                      url -> CookieManager.getInstance().getCookie(url);
              private volatile boolean streamRunning;
              private AtomicBoolean cancelFlag;

              private String pendingUrl;
              private String pendingUserAgent;
              private String pendingDisposition;
              private String pendingMime;
              private String pendingReferer;
              private String pendingName;
              private long lastBlockedToast;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF0F1115);

                  webView = new WebView(this);
                  root.addView(webView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  progressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progressBar.setMax(100);
                  progressBar.setVisibility(View.GONE);
                  root.addView(progressBar, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(3), Gravity.TOP));

                  downloadButton = new TextView(this);
                  downloadButton.setText("\u2193 Download");
                  downloadButton.setTextColor(0xFFFFFFFF);
                  downloadButton.setTextSize(14);
                  downloadButton.setPadding(dp(16), dp(10), dp(16), dp(10));
                  GradientDrawable buttonBackground = new GradientDrawable();
                  buttonBackground.setColor(0xFF7C5CFF);
                  buttonBackground.setCornerRadius(dp(24));
                  downloadButton.setBackground(buttonBackground);
                  downloadButton.setElevation(dp(6));
                  downloadButton.setVisibility(View.GONE);
                  downloadButton.setOnClickListener(v -> onDownloadButtonClicked());
                  FrameLayout.LayoutParams buttonParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM | Gravity.END);
                  buttonParams.setMargins(0, 0, dp(16), dp(24));
                  root.addView(downloadButton, buttonParams);

                  setContentView(root);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setUseWideViewPort(true);
                  s.setSupportMultipleWindows(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  // Some sites and video players treat the "; wv" WebView marker differently, so drop it.
                  s.setUserAgentString(s.getUserAgentString().replace("; wv", ""));

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);

                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) ->
                          startDownload(url, userAgent, contentDisposition, mimeType));

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (!request.isForMainFrame()) {
                              return false;
                          }
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) {
                              if (looksLikeDownload(uri)) {
                                  startDownload(uri.toString(), view.getSettings().getUserAgentString(), null, null);
                                  return true;
                              }
                              if (isAllowedHost(uri.getHost())) {
                                  return false;
                              }
                              // Ads, pop-ups and redirects to other sites are blocked.
                              notifyBlocked(uri);
                              return true;
                          }
                          if ("blob".equals(scheme) || "data".equals(scheme)
                                  || "about".equals(scheme) || "javascript".equals(scheme)) {
                              return false;
                          }
                          // Non-web links such as mailto: or app links open in the matching app.
                          openExternally(uri);
                          return true;
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          // Runs on a background thread. Only takes note of video addresses; never changes a request.
                          Uri uri = request.getUrl();
                          String path = uri.getPath();
                          if (path != null) {
                              String lower = path.toLowerCase(Locale.ROOT);
                              boolean stream = lower.contains(".m3u8");
                              boolean file = lower.endsWith(".mp4") || lower.endsWith(".mkv") || lower.endsWith(".webm");
                              if (stream || file) {
                                  noteMedia(uri.toString(), stream, request.getRequestHeaders());
                              }
                          }
                          return null;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          progressBar.setVisibility(View.VISIBLE);
                          synchronized (detected) {
                              detected.clear();
                          }
                          updateDownloadButton();
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                          CookieManager.getInstance().flush();
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request,
                                                  WebResourceError error) {
                          if (request.isForMainFrame()) {
                              view.loadDataWithBaseURL(null, ERROR_HTML, "text/html", "UTF-8", null);
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          progressBar.setProgress(newProgress);
                      }

                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          webView.setVisibility(View.GONE);
                          root.addView(view, new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          downloadButton.bringToFront();
                          enterImmersive();
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                      }

                      @Override
                      public void onHideCustomView() {
                          hideCustomView();
                      }

                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture,
                                                    Message resultMsg) {
                          if (!isUserGesture) {
                              return false; // pop-ups that open without a tap are blocked
                          }
                          final WebView popup = new WebView(MainActivity.this);
                          final boolean[] handled = {false};
                          popup.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest request) {
                                  handlePopupUrl(request.getUrl(), handled, v);
                                  return true;
                              }

                              @Override
                              public void onPageStarted(WebView v, String url, Bitmap favicon) {
                                  if (url != null && !"about:blank".equals(url)) {
                                      handlePopupUrl(Uri.parse(url), handled, v);
                                  }
                              }
                          });
                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(popup);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(START_URL);
                  }
              }

              // ------------------------------------------------------------------ site rules

              private boolean isAllowedHost(String host) {
                  if (host == null) {
                      return false;
                  }
                  for (String allowed : ALLOWED_HOSTS) {
                      if (host.equals(allowed) || host.endsWith("." + allowed)) {
                          return true;
                      }
                  }
                  return false;
              }

              private void handlePopupUrl(Uri uri, boolean[] handled, WebView popup) {
                  if (handled[0] || uri == null) {
                      return;
                  }
                  handled[0] = true;
                  popup.stopLoading();
                  new Handler(Looper.getMainLooper()).post(popup::destroy);
                  String scheme = uri.getScheme();
                  if (("http".equals(scheme) || "https".equals(scheme)) && isAllowedHost(uri.getHost())) {
                      webView.loadUrl(uri.toString());
                  } else {
                      notifyBlocked(uri);
                  }
              }

              private void notifyBlocked(Uri uri) {
                  long now = System.currentTimeMillis();
                  if (now - lastBlockedToast > 2500) {
                      lastBlockedToast = now;
                      Toast.makeText(this, "Blocked: " + uri.getHost(), Toast.LENGTH_SHORT).show();
                  }
              }

              private boolean looksLikeDownload(Uri uri) {
                  String path = uri.getPath();
                  if (path == null) {
                      return false;
                  }
                  String lower = path.toLowerCase(Locale.ROOT);
                  for (String ext : DOWNLOAD_EXTENSIONS) {
                      if (lower.endsWith(ext)) {
                          return true;
                      }
                  }
                  return false;
              }

              // ------------------------------------------------------------------ video detection and button

              private void noteMedia(String url, boolean stream, Map<String, String> requestHeaders) {
                  Map<String, String> copy = new HashMap<>();
                  if (requestHeaders != null) {
                      copy.putAll(requestHeaders);
                  }
                  synchronized (detected) {
                      for (Media m : detected) {
                          if (m.url.equals(url)) {
                              return;
                          }
                      }
                      detected.add(new Media(url, stream, copy));
                      while (detected.size() > 20) {
                          detected.remove(0);
                      }
                  }
                  runOnUiThread(this::updateDownloadButton);
              }

              private void updateDownloadButton() {
                  boolean any;
                  synchronized (detected) {
                      any = !detected.isEmpty();
                  }
                  if (!streamRunning) {
                      downloadButton.setText("\u2193 Download");
                  }
                  downloadButton.setVisibility(any || streamRunning ? View.VISIBLE : View.GONE);
              }

              private void onDownloadButtonClicked() {
                  if (streamRunning) {
                      new AlertDialog.Builder(this)
                              .setMessage("Stop this download?")
                              .setPositiveButton("Stop", (d, which) -> {
                                  if (cancelFlag != null) {
                                      cancelFlag.set(true);
                                  }
                              })
                              .setNegativeButton("Keep going", null)
                              .show();
                      return;
                  }
                  final List<Media> items;
                  synchronized (detected) {
                      items = new ArrayList<>(detected);
                  }
                  if (items.isEmpty()) {
                      Toast.makeText(this, "No video found yet. Start playing the video first.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  Collections.reverse(items); // newest first
                  String[] labels = new String[items.size()];
                  for (int i = 0; i < labels.length; i++) {
                      labels[i] = labelFor(items.get(i));
                  }
                  new AlertDialog.Builder(this)
                          .setTitle("Choose video to save")
                          .setItems(labels, (dialog, which) -> startMedia(items.get(which)))
                          .show();
              }

              private String labelFor(Media m) {
                  Uri u = Uri.parse(m.url);
                  String name = u.getLastPathSegment();
                  if (name == null) {
                      name = "";
                  }
                  if (name.length() > 30) {
                      name = name.substring(name.length() - 30);
                  }
                  return (m.stream ? "Stream" : "File") + " - " + u.getHost() + " - " + name;
              }

              private String baseName() {
                  String title = webView.getTitle();
                  if (title == null) {
                      title = "";
                  }
                  title = title.replaceAll("[^\\p{L}\\p{N} ._()\\-]", " ").replaceAll("\\s+", " ").trim();
                  if (title.length() > 80) {
                      title = title.substring(0, 80).trim();
                  }
                  if (title.isEmpty()) {
                      title = "video";
                  }
                  return title;
              }

              private static String extensionOf(String url) {
                  String path = Uri.parse(url).getPath();
                  if (path != null) {
                      int dot = path.lastIndexOf('.');
                      if (dot >= 0 && path.length() - dot <= 6) {
                          return path.substring(dot).toLowerCase(Locale.ROOT);
                      }
                  }
                  return ".mp4";
              }

              private static String headerIgnoreCase(Map<String, String> headers, String name) {
                  for (Map.Entry<String, String> e : headers.entrySet()) {
                      if (e.getKey() != null && e.getKey().equalsIgnoreCase(name)) {
                          return e.getValue();
                      }
                  }
                  return null;
              }

              private void toastLong(String message) {
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show();
              }

              // ------------------------------------------------------------------ saving a chosen video

              private void startMedia(Media m) {
                  if (!m.stream) {
                      startDownload(m.url, webView.getSettings().getUserAgentString(), null, null,
                              headerIgnoreCase(m.headers, "Referer"), baseName() + extensionOf(m.url));
                      return;
                  }
                  Toast.makeText(this, "Reading stream...", Toast.LENGTH_SHORT).show();
                  loadPlaylist(m, m.url);
              }

              /** Reads a playlist in the background, then continues with quality choice or download. */
              private void loadPlaylist(final Media m, final String playlistUrl) {
                  new Thread(() -> {
                      try {
                          final HlsDownloader.Parsed parsed = HlsDownloader.load(playlistUrl, m.headers, cookieProvider);
                          runOnUiThread(() -> onPlaylistLoaded(m, parsed));
                      } catch (Exception e) {
                          final String message = e.getMessage();
                          runOnUiThread(() -> toastLong("Could not read the stream: " + message));
                      }
                  }, "stream-read").start();
              }

              private void onPlaylistLoaded(final Media m, HlsDownloader.Parsed parsed) {
                  if (parsed.media != null) {
                      beginStreamDownload(m, parsed.media);
                      return;
                  }
                  final List<HlsDownloader.Variant> variants = new ArrayList<>(parsed.variants);
                  if (variants.isEmpty()) {
                      toastLong("No video found in this stream");
                      return;
                  }
                  Collections.sort(variants, (a, b) -> Long.compare(b.bandwidth, a.bandwidth));
                  if (variants.size() == 1) {
                      loadPlaylist(m, variants.get(0).url);
                      return;
                  }
                  String[] labels = new String[variants.size()];
                  for (int i = 0; i < labels.length; i++) {
                      labels[i] = variantLabel(variants.get(i));
                  }
                  new AlertDialog.Builder(this)
                          .setTitle("Choose quality")
                          .setItems(labels, (dialog, which) -> loadPlaylist(m, variants.get(which).url))
                          .show();
              }

              private static String variantLabel(HlsDownloader.Variant v) {
                  String size = v.resolution != null ? v.resolution : "Unknown size";
                  if (v.bandwidth > 0) {
                      long mbPerMinute = Math.max(1, v.bandwidth * 60 / 8 / 1000000);
                      return size + "  (about " + mbPerMinute + " MB per minute)";
                  }
                  return size;
              }

              private void beginStreamDownload(final Media m, final HlsDownloader.MediaPlaylist playlist) {
                  if (streamRunning) {
                      toastLong("A download is already running");
                      return;
                  }
                  if (playlist.segments.isEmpty()) {
                      toastLong("No video parts found in this stream");
                      return;
                  }
                  if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P
                          && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, REQ_STORAGE_STREAM);
                      toastLong("Allow storage access, then tap Download again");
                      return;
                  }
                  final boolean mp4 = playlist.initUrl != null;
                  final String name = baseName() + (mp4 ? ".mp4" : ".ts");
                  final String mime = mp4 ? "video/mp4" : "video/mp2t";
                  streamRunning = true;
                  cancelFlag = new AtomicBoolean(false);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  downloadButton.setText("Starting... tap to stop");
                  updateDownloadButton();
                  toastLong("Saving " + name + ". Keep the app open until it finishes.");
                  new Thread(() -> runStreamDownload(m, playlist, name, mime), "stream-download").start();
              }

              /** Runs on a background thread. */
              private void runStreamDownload(Media m, HlsDownloader.MediaPlaylist playlist, final String name,
                                             String mime) {
                  Output out = null;
                  try {
                      out = openOutput(name, mime);
                      HlsDownloader.download(playlist, out.stream, m.headers, cookieProvider, (done, total) -> {
                          final int percent = (int) (done * 100L / total);
                          runOnUiThread(() -> {
                              if (streamRunning) {
                                  downloadButton.setText(percent + "% - tap to stop");
                              }
                          });
                      }, cancelFlag);
                      finishOutput(out);
                      out = null;
                      runOnUiThread(() -> toastLong("Saved to Downloads: " + name
                              + ". Play it with VLC or MX Player."));
                  } catch (HlsDownloader.CancelledException e) {
                      discardOutput(out);
                      runOnUiThread(() -> toastLong("Download stopped"));
                  } catch (Exception e) {
                      discardOutput(out);
                      final String message = e.getMessage();
                      runOnUiThread(() -> toastLong("Download failed: " + message));
                  } finally {
                      runOnUiThread(() -> {
                          streamRunning = false;
                          getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          updateDownloadButton();
                      });
                  }
              }

              private Output openOutput(String name, String mime) throws IOException {
                  Output o = new Output();
                  OutputStream raw;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      values.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                      values.put(MediaStore.MediaColumns.IS_PENDING, 1);
                      Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (uri == null) {
                          throw new IOException("Could not create the file");
                      }
                      o.uri = uri;
                      raw = getContentResolver().openOutputStream(uri);
                      if (raw == null) {
                          throw new IOException("Could not open the file");
                      }
                  } else {
                      File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!dir.exists() && !dir.mkdirs()) {
                          throw new IOException("Could not open the Downloads folder");
                      }
                      o.file = new File(dir, name);
                      raw = new FileOutputStream(o.file);
                  }
                  o.stream = new BufferedOutputStream(raw, 256 * 1024);
                  return o;
              }

              private void finishOutput(Output o) throws IOException {
                  o.stream.flush();
                  o.stream.close();
                  if (o.uri != null) {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      getContentResolver().update(o.uri, values, null, null);
                  } else if (o.file != null) {
                      MediaScannerConnection.scanFile(this, new String[]{o.file.getAbsolutePath()}, null, null);
                  }
              }

              private void discardOutput(Output o) {
                  if (o == null) {
                      return;
                  }
                  try {
                      o.stream.close();
                  } catch (IOException ignored) {
                      // Already closed or broken; the file is being removed anyway.
                  }
                  if (o.uri != null) {
                      getContentResolver().delete(o.uri, null, null);
                  } else if (o.file != null) {
                      //noinspection ResultOfMethodCallIgnored
                      o.file.delete();
                  }
              }

              // ------------------------------------------------------------------ plain file downloads

              private void startDownload(String url, String userAgent, String contentDisposition,
                                         String mimeType) {
                  startDownload(url, userAgent, contentDisposition, mimeType, null, null);
              }

              private void startDownload(String url, String userAgent, String contentDisposition,
                                         String mimeType, String referer, String fileName) {
                  if (url == null || !(url.startsWith("http://") || url.startsWith("https://"))) {
                      toastLong("This type of download is not supported yet");
                      return;
                  }
                  if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P
                          && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      pendingUrl = url;
                      pendingUserAgent = userAgent;
                      pendingDisposition = contentDisposition;
                      pendingMime = mimeType;
                      pendingReferer = referer;
                      pendingName = fileName;
                      requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, REQ_STORAGE);
                      return;
                  }
                  try {
                      String name = fileName != null ? fileName
                              : URLUtil.guessFileName(url, contentDisposition, mimeType);
                      DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                      if (mimeType != null && !mimeType.isEmpty()) {
                          req.setMimeType(mimeType);
                      }
                      String cookie = CookieManager.getInstance().getCookie(url);
                      if (cookie != null) {
                          req.addRequestHeader("Cookie", cookie);
                      }
                      if (userAgent != null) {
                          req.addRequestHeader("User-Agent", userAgent);
                      }
                      String ref = referer != null ? referer : webView.getUrl();
                      if (ref != null) {
                          req.addRequestHeader("Referer", ref);
                      }
                      req.setTitle(name);
                      req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      dm.enqueue(req);
                      toastLong("Downloading " + name + " (see notifications)");
                  } catch (Exception e) {
                      toastLong("Download failed: " + e.getMessage());
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                  if (requestCode == REQ_STORAGE && pendingUrl != null) {
                      String url = pendingUrl;
                      pendingUrl = null;
                      if (granted) {
                          startDownload(url, pendingUserAgent, pendingDisposition, pendingMime,
                                  pendingReferer, pendingName);
                      } else {
                          toastLong("Storage permission is needed to download");
                      }
                  } else if (requestCode == REQ_STORAGE_STREAM && !granted) {
                      toastLong("Storage permission is needed to save videos");
                  }
              }

              private void openExternally(Uri uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (ActivityNotFoundException ignored) {
                      // No app can handle this link; do nothing.
                  }
              }

              // ------------------------------------------------------------------ fullscreen video and lifecycle

              private void hideCustomView() {
                  if (customView == null) {
                      return;
                  }
                  root.removeView(customView);
                  customView = null;
                  webView.setVisibility(View.VISIBLE);
                  exitImmersive();
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  if (customViewCallback != null) {
                      customViewCallback.onCustomViewHidden();
                      customViewCallback = null;
                  }
              }

              @SuppressWarnings("deprecation")
              private void enterImmersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @SuppressWarnings("deprecation")
              private void exitImmersive() {
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (customView != null) {
                      hideCustomView();
                  } else if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  webView.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  webView.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (cancelFlag != null) {
                      cancelFlag.set(true);
                  }
                  root.removeAllViews();
                  webView.destroy();
                  super.onDestroy();
              }
          }
