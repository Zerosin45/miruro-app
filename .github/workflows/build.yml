# Miruro Android app: one-file builder.
# This single file creates the whole Android project, builds the APK, and publishes it
# on the repository's Releases page (Releases -> latest -> MiruroApp.apk).
# Edit START_URL / ALLOWED_HOSTS inside MainActivity.java below to change the site.
name: Build Miruro APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create the Android project
        run: |
          mkdir -p proj
          cd proj
          mkdir -p app
          mkdir -p app/src/main
          mkdir -p app/src/main/java/com/example/miruroapp
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.miruroapp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.miruroapp"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|navigation"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF_FILE
          cat > app/src/main/java/com/example/miruroapp/MainActivity.java <<'EOF_FILE'
          package com.example.miruroapp;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;

          public class MainActivity extends Activity {

              // ---- Edit these two lines to change the site or which hosts stay inside the app ----
              private static final String START_URL = "https://www.miruro.ru/";
              private static final String[] ALLOWED_HOSTS = {"miruro.ru"};
              // -------------------------------------------------------------------------------------

              private static final String ERROR_HTML =
                      "<html><head><meta name='viewport' content='width=device-width, initial-scale=1'></head>"
                              + "<body style='background:#0f1115;color:#e6e6e6;font-family:sans-serif;"
                              + "text-align:center;padding-top:30vh'>"
                              + "<h2>Can't reach the site</h2><p>Check your internet connection.</p>"
                              + "<a href='" + START_URL + "' style='color:#a78bfa;font-size:1.2em'>Try again</a>"
                              + "</body></html>";

              private FrameLayout root;
              private WebView webView;
              private ProgressBar progressBar;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF0F1115);

                  webView = new WebView(this);
                  root.addView(webView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  progressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progressBar.setMax(100);
                  progressBar.setVisibility(View.GONE);
                  root.addView(progressBar, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(3), Gravity.TOP));

                  setContentView(root);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setUseWideViewPort(true);
                  s.setSupportMultipleWindows(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  // Some sites and video players treat the "; wv" WebView marker differently, so drop it.
                  s.setUserAgentString(s.getUserAgentString().replace("; wv", ""));

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (!request.isForMainFrame()) {
                              return false;
                          }
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          boolean isWeb = "http".equals(scheme) || "https".equals(scheme);
                          if (isWeb && isAllowedHost(uri.getHost())) {
                              return false;
                          }
                          openExternally(uri);
                          return true;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          progressBar.setVisibility(View.VISIBLE);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request,
                                                  WebResourceError error) {
                          if (request.isForMainFrame()) {
                              view.loadDataWithBaseURL(null, ERROR_HTML, "text/html", "UTF-8", null);
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          progressBar.setProgress(newProgress);
                      }

                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          webView.setVisibility(View.GONE);
                          root.addView(view, new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          enterImmersive();
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                      }

                      @Override
                      public void onHideCustomView() {
                          hideCustomView();
                      }
                  });

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(START_URL);
                  }
              }

              private boolean isAllowedHost(String host) {
                  if (host == null) {
                      return false;
                  }
                  for (String allowed : ALLOWED_HOSTS) {
                      if (host.equals(allowed) || host.endsWith("." + allowed)) {
                          return true;
                      }
                  }
                  return false;
              }

              private void openExternally(Uri uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (ActivityNotFoundException ignored) {
                      // No app can handle this link; do nothing.
                  }
              }

              private void hideCustomView() {
                  if (customView == null) {
                      return;
                  }
                  root.removeView(customView);
                  customView = null;
                  webView.setVisibility(View.VISIBLE);
                  exitImmersive();
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  if (customViewCallback != null) {
                      customViewCallback.onCustomViewHidden();
                      customViewCallback = null;
                  }
              }

              @SuppressWarnings("deprecation")
              private void enterImmersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @SuppressWarnings("deprecation")
              private void exitImmersive() {
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (customView != null) {
                      hideCustomView();
                  } else if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  webView.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  webView.onResume();
              }

              @Override
              protected void onDestroy() {
                  root.removeAllViews();
                  webView.destroy();
                  super.onDestroy();
              }
          }
          EOF_FILE
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Purple circle -->
              <path
                  android:fillColor="#7C5CFF"
                  android:pathData="M54,54m-26,0a26,26 0,1 1,52 0a26,26 0,1 1,-52 0" />
              <!-- White play triangle -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M47,40L47,68L71,54Z" />
          </vector>
          EOF_FILE
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_FILE
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_FILE
          cat > app/src/main/res/values/colors.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="app_background">#0F1115</color>
              <color name="ic_launcher_background">#0F1115</color>
          </resources>
          EOF_FILE
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Miruro</string>
          </resources>
          EOF_FILE
          cat > app/src/main/res/values/themes.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@color/app_background</item>
                  <item name="android:statusBarColor">@color/app_background</item>
                  <item name="android:navigationBarColor">@color/app_background</item>
              </style>
          </resources>
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF_FILE
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MiruroApp"
          include(":app")
          EOF_FILE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk MiruroApp.apk

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiruroApp-apk
          path: MiruroApp.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" MiruroApp.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Miruro app build ${{ github.run_number }}" \
            --notes "Download MiruroApp.apk below and install it on your Android phone."# Miruro Android app: one-file builder.
